<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06100c">
<link rel="icon" href="../assets/icon-192.png">
<title>주간리뷰 — 영남지사</title>
<link rel="stylesheet" href="../assets/brand.css">
</head>
<body>

<div class="brand-bg"><img class="brand-logo" src="../assets/halla_logo.png" alt="HALLA CEMENT"></div>

<div class="top-bar">
  <div class="top-bar-left">
    <a href="../index.html" class="back-btn">← 영남지사</a>
    <span class="top-title">주간리뷰</span>
  </div>
  <span class="top-badge" id="period-badge">-</span>
</div>

<div class="page-wrap">

  <!-- 기간 설정 -->
  <div class="card">
    <div class="card-title">주간 설정 <span>주 시작일(월요일 권장) 기준 7일</span></div>
    <div class="form-grid">
      <div class="field">
        <label>주 시작일</label>
        <input type="date" id="w-start" onchange="onStartChange()">
      </div>
      <div class="field">
        <label>주 종료일 (자동, 6일 후)</label>
        <input type="date" id="w-end" disabled>
      </div>
    </div>
  </div>

  <!-- 영업소별 실적 -->
  <div class="card">
    <div class="card-title">영업소별 계획 대비 실적 (톤)</div>
    <div class="tbl-wrap">
      <table class="data-tbl" id="w-table">
        <thead>
          <tr>
            <th>영업소</th>
            <th>계획</th>
            <th>실적</th>
            <th>달성률</th>
          </tr>
        </thead>
        <tbody id="w-tbody"></tbody>
        <tfoot>
          <tr class="sum-row">
            <td>영남지사 합계</td>
            <td id="sum-plan">0</td>
            <td id="sum-actual">0</td>
            <td id="sum-rate">0%</td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>

  <!-- 영업소별 이슈 / 차주계획 -->
  <div class="card">
    <div class="card-title">영업소별 이슈 · 차주 계획</div>
    <div id="w-notes"></div>
  </div>

  <!-- 지사 종합 -->
  <div class="card">
    <div class="card-title">지사 종합</div>
    <div class="form-full form-grid" style="gap:12px">
      <div class="field">
        <label>종합 이슈 / 시장 동향</label>
        <textarea id="w-summary-issue" placeholder="영남지사 전체 공통 이슈, 시장 동향, 경쟁사 동향 등" rows="3"></textarea>
      </div>
      <div class="field">
        <label>차주 중점 추진사항</label>
        <textarea id="w-summary-plan" placeholder="지사 차원의 다음 주 중점 과제" rows="3"></textarea>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="clearForm()">초기화</button>
      <button class="btn btn-lime" onclick="copyReport()">📋 리뷰 복사 (엑셀/메일용)</button>
      <button class="btn btn-primary" onclick="saveRecord()">주간 저장</button>
    </div>
  </div>

  <!-- 저장 이력 -->
  <div class="card">
    <div class="card-title">저장된 주간 이력 <span id="hist-count" class="badge">0건</span></div>
    <div id="hist-list"><div class="empty"><div class="empty-icon">📭</div>저장된 주간리뷰가 없어요.</div></div>
  </div>

</div>

<div id="toast"></div>

<script>
const OFFICES = ['부산','울산','경남동부','경남서부','경북동부','경북서부'];
const STORE_KEY = 'yn_weekly_records';
let currentId = null;

function buildRows(){
  document.getElementById('w-tbody').innerHTML = OFFICES.map(o => `
    <tr data-office="${o}">
      <td class="office-name">${o}</td>
      <td><input type="number" min="0" step="0.01" class="in-plan" oninput="recalc()"></td>
      <td><input type="number" min="0" step="0.01" class="in-actual" oninput="recalc()"></td>
      <td class="row-rate" style="font-weight:600;color:var(--accent)">0%</td>
    </tr>
  `).join('');

  document.getElementById('w-notes').innerHTML = OFFICES.map(o => `
    <div style="margin-bottom:14px">
      <div style="font-size:12px;color:var(--text2);font-weight:500;margin-bottom:6px">${o}</div>
      <div class="form-grid" style="gap:8px">
        <textarea class="field in-issue" data-office="${o}" placeholder="${o} 주요 이슈" rows="2" style="font-size:13px;padding:9px 11px;border:.5px solid var(--border);border-radius:var(--radius-sm);background:var(--bg3);color:var(--text);font-family:var(--font);resize:vertical"></textarea>
        <textarea class="field in-plan-note" data-office="${o}" placeholder="${o} 차주 계획" rows="2" style="font-size:13px;padding:9px 11px;border:.5px solid var(--border);border-radius:var(--radius-sm);background:var(--bg3);color:var(--text);font-family:var(--font);resize:vertical"></textarea>
      </div>
    </div>
  `).join('');
}

function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function fmt(n){ return n.toLocaleString('ko-KR',{maximumFractionDigits:2}); }

function recalc(){
  let sPlan=0, sActual=0;
  document.querySelectorAll('#w-tbody tr').forEach(tr=>{
    const plan = num(tr.querySelector('.in-plan').value);
    const actual = num(tr.querySelector('.in-actual').value);
    const rate = plan>0 ? (actual/plan*100) : 0;
    tr.querySelector('.row-rate').textContent = fmt(rate)+'%';
    sPlan+=plan; sActual+=actual;
  });
  document.getElementById('sum-plan').textContent = fmt(sPlan);
  document.getElementById('sum-actual').textContent = fmt(sActual);
  document.getElementById('sum-rate').textContent = (sPlan>0 ? fmt(sActual/sPlan*100) : 0)+'%';
}

function fmtDate(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function onStartChange(){
  const s = document.getElementById('w-start').value;
  if(!s) return;
  const d = new Date(s+'T00:00:00');
  d.setDate(d.getDate()+6);
  document.getElementById('w-end').value = fmtDate(d);
  updatePeriodBadge();
}

function updatePeriodBadge(){
  const s = document.getElementById('w-start').value;
  const e = document.getElementById('w-end').value;
  document.getElementById('period-badge').textContent = s ? `${s} ~ ${e}` : '-';
}

function clearForm(){
  currentId = null;
  document.getElementById('w-start').value = '';
  document.getElementById('w-end').value = '';
  document.getElementById('w-summary-issue').value = '';
  document.getElementById('w-summary-plan').value = '';
  buildRows();
  recalc();
  updatePeriodBadge();
}

function collectData(){
  const offices = {};
  document.querySelectorAll('#w-tbody tr').forEach(tr=>{
    offices[tr.dataset.office] = {
      plan: num(tr.querySelector('.in-plan').value),
      actual: num(tr.querySelector('.in-actual').value),
    };
  });
  document.querySelectorAll('.in-issue').forEach(el=>{
    offices[el.dataset.office].issue = el.value.trim();
  });
  document.querySelectorAll('.in-plan-note').forEach(el=>{
    offices[el.dataset.office].planNote = el.value.trim();
  });
  return offices;
}

function loadRecords(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); }catch(e){ return []; }
}
function saveRecords(list){ localStorage.setItem(STORE_KEY, JSON.stringify(list)); }

function saveRecord(){
  const start = document.getElementById('w-start').value;
  if(!start){ toast('주 시작일을 선택해주세요'); return; }
  const end = document.getElementById('w-end').value;
  const offices = collectData();
  const summaryIssue = document.getElementById('w-summary-issue').value.trim();
  const summaryPlan = document.getElementById('w-summary-plan').value.trim();
  const list = loadRecords();

  if(currentId){
    const idx = list.findIndex(r=>r.id===currentId);
    if(idx>-1) list[idx] = {...list[idx], start, end, offices, summaryIssue, summaryPlan, savedAt:new Date().toISOString()};
  } else {
    currentId = Date.now();
    list.unshift({id:currentId, start, end, offices, summaryIssue, summaryPlan, savedAt:new Date().toISOString()});
  }
  saveRecords(list);
  renderHistory();
  toast('저장되었습니다');
}

function renderHistory(){
  const list = loadRecords().sort((a,b)=> b.start.localeCompare(a.start));
  document.getElementById('hist-count').textContent = list.length+'건';
  const wrap = document.getElementById('hist-list');
  if(!list.length){
    wrap.innerHTML = '<div class="empty"><div class="empty-icon">📭</div>저장된 주간리뷰가 없어요.</div>';
    return;
  }
  wrap.innerHTML = list.map(r=>{
    const plan = Object.values(r.offices).reduce((s,o)=> s+o.plan, 0);
    const actual = Object.values(r.offices).reduce((s,o)=> s+o.actual, 0);
    const rate = plan>0 ? (actual/plan*100).toFixed(1) : '0';
    return `
    <div class="hist-item ${r.id===currentId?'active':''}" onclick="loadRecord(${r.id})">
      <div>
        <div class="hist-main">${r.start} ~ ${r.end}</div>
        <div class="hist-sub">달성률 ${rate}% (계획 ${fmt(plan)}t / 실적 ${fmt(actual)}t) · 저장 ${new Date(r.savedAt).toLocaleString('ko-KR')}</div>
      </div>
      <button class="hist-del" onclick="event.stopPropagation();delRecord(${r.id})">×</button>
    </div>`;
  }).join('');
}

function loadRecord(id){
  const list = loadRecords();
  const r = list.find(x=>x.id===id);
  if(!r) return;
  currentId = id;
  document.getElementById('w-start').value = r.start;
  document.getElementById('w-end').value = r.end;
  document.getElementById('w-summary-issue').value = r.summaryIssue || '';
  document.getElementById('w-summary-plan').value = r.summaryPlan || '';
  buildRows();
  document.querySelectorAll('#w-tbody tr').forEach(tr=>{
    const o = r.offices[tr.dataset.office];
    if(!o) return;
    tr.querySelector('.in-plan').value = o.plan || '';
    tr.querySelector('.in-actual').value = o.actual || '';
  });
  document.querySelectorAll('.in-issue').forEach(el=>{
    el.value = (r.offices[el.dataset.office] || {}).issue || '';
  });
  document.querySelectorAll('.in-plan-note').forEach(el=>{
    el.value = (r.offices[el.dataset.office] || {}).planNote || '';
  });
  recalc();
  updatePeriodBadge();
  renderHistory();
}

function delRecord(id){
  if(!confirm('이 주간 기록을 삭제할까요?')) return;
  saveRecords(loadRecords().filter(r=>r.id!==id));
  if(currentId===id) clearForm();
  renderHistory();
}

function copyReport(){
  const start = document.getElementById('w-start').value || '-';
  const end = document.getElementById('w-end').value || '-';
  let text = `[영남지사 주간리뷰] ${start} ~ ${end}\n\n`;
  text += ['영업소','계획','실적','달성률'].join('\t')+'\n';
  let sPlan=0, sActual=0;
  document.querySelectorAll('#w-tbody tr').forEach(tr=>{
    const plan = num(tr.querySelector('.in-plan').value);
    const actual = num(tr.querySelector('.in-actual').value);
    const rate = plan>0 ? (actual/plan*100).toFixed(1) : '0';
    sPlan+=plan; sActual+=actual;
    text += [tr.dataset.office, plan, actual, rate+'%'].join('\t')+'\n';
  });
  const sRate = sPlan>0 ? (sActual/sPlan*100).toFixed(1) : '0';
  text += ['영남지사 합계', sPlan, sActual, sRate+'%'].join('\t')+'\n\n';

  text += '■ 영업소별 이슈 / 차주계획\n';
  OFFICES.forEach(o=>{
    const issue = document.querySelector(`.in-issue[data-office="${o}"]`).value.trim();
    const plan = document.querySelector(`.in-plan-note[data-office="${o}"]`).value.trim();
    if(issue || plan) text += `- ${o}\n  이슈: ${issue || '-'}\n  차주계획: ${plan || '-'}\n`;
  });

  text += `\n■ 지사 종합 이슈/시장동향\n${document.getElementById('w-summary-issue').value.trim() || '-'}\n`;
  text += `\n■ 차주 중점 추진사항\n${document.getElementById('w-summary-plan').value.trim() || '-'}\n`;

  navigator.clipboard.writeText(text).then(()=> toast('리뷰 내용이 복사되었습니다'))
    .catch(()=> toast('복사 실패 — 브라우저 권한을 확인하세요'));
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}

buildRows();
recalc();
renderHistory();
</script>

</body>
</html>
