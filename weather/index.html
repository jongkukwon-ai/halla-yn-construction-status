<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>날씨 조회 · 영남지사</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --ink:#0F1B2D; --ink-muted:#4A5568; --ink-faint:#8898AA;
    --surface:#F7F9FC; --card:#FFFFFF; --border:#DDE3EC; --border-strong:#B8C4D6;
    --navy:#24282C; --navy-light:#3A4046; --teal:#00875A;
    --grid:#E7ECF3;
    --s-max:#eb6834;   /* 기온(최고) — 차트 1번 색 */
    --s-min:#2a78d6;   /* 최저 */
    --s-rain:#1baf7a;  /* 강수량 */
    --warn:#B42318; --warn-bg:#FEF3F2; --cold:#175CD3; --cold-bg:#EFF8FF;
  }
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Pretendard Variable','Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif; background:var(--surface);
         color:var(--ink); font-size:14px; line-height:1.5; min-height:100vh; }
  .site-header { background:var(--navy); padding:0 24px; display:flex; align-items:center; justify-content:space-between;
                 gap:12px; height:56px; position:sticky; top:0; z-index:100; border-bottom:2px solid var(--teal); }
  .site-title { color:#fff; font-size:16px; font-weight:700; letter-spacing:-0.3px; }
  .site-sub { color:#B9C0C7; font-size:12px; margin-top:1px; }
  .back { flex-shrink:0; color:#B9C0C7; font-size:12px; text-decoration:none; border:1px solid rgba(185,192,199,.45);
          border-radius:20px; padding:5px 12px; white-space:nowrap; }
  .main { padding:20px 24px 48px; max-width:1320px; margin:0 auto; }

  .picker { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:flex-end; background:var(--card); border:1px solid var(--border);
            border-radius:10px; padding:12px 16px; margin-bottom:16px; }
  .picker label { display:flex; flex-direction:column; gap:3px; font-size:11px; color:var(--ink-faint); }
  .picker select { border:1px solid var(--border-strong); border-radius:8px; padding:7px 10px; font-size:14px; font-family:inherit;
                   color:var(--ink); background:#fff; min-width:150px; }
  .picker .pick-note { font-size:12px; color:var(--ink-muted); padding-bottom:8px; }
  .picker .pick-note b { color:var(--ink); }

  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px 18px; margin-bottom:16px; }
  .card h2 { font-size:15px; font-weight:700; margin-bottom:2px; }
  .card .desc { font-size:12px; color:var(--ink-faint); margin-bottom:12px; }
  .card-head { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:2px; }
  .empty { color:var(--ink-faint); font-size:13px; padding:12px 0; }

  /* 지금 날씨 + 4일 요약 */
  .now-wrap { display:grid; grid-template-columns:minmax(220px,300px) 1fr; gap:16px; align-items:stretch; }
  .now { border:1px solid var(--border); border-radius:10px; padding:14px 16px; background:var(--surface); }
  .now-t { font-size:40px; font-weight:700; line-height:1.1; letter-spacing:-1px; }
  .now-t span { font-size:28px; margin-right:6px; }
  .now-meta { margin-top:8px; display:grid; grid-template-columns:repeat(2,auto); justify-content:start; gap:2px 16px;
              font-size:13px; color:var(--ink-muted); }
  .now-meta b { color:var(--ink); font-weight:600; }
  .now-time { margin-top:8px; font-size:11px; color:var(--ink-faint); }
  .days { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .day { border:1px solid var(--border); border-radius:10px; padding:10px 8px; text-align:center; }
  .day-l { font-size:12px; color:var(--ink-muted); }
  .day-i { font-size:26px; line-height:1.3; }
  .day-wx { font-size:12px; color:var(--ink-muted); }
  .day-t { font-size:14px; font-weight:600; margin-top:2px; }
  .day-t .mn { color:var(--cold); } .day-t .mx { color:#C4320A; }
  .day-p { font-size:12px; color:var(--ink-faint); }

  /* 시간대별 예보(차트와 표가 함께 가로로 넘어감) */
  .scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--border); border-radius:8px; position:relative; }
  .hgrid { display:grid; grid-auto-flow:column; grid-auto-columns:56px; }
  .hcol { text-align:center; font-size:12px; border-left:1px solid var(--grid); }
  .hcol.newday { border-left:2px solid var(--border-strong); }
  .hcol > div { height:26px; line-height:26px; white-space:nowrap; }
  .hcol .hd { font-size:11px; color:var(--ink-faint); height:20px; line-height:20px; }
  .hcol .hh { font-weight:600; }
  .hcol .hi { font-size:18px; }
  .hcol .ht { font-weight:700; }
  .hcol .hp.wet { color:var(--cold); font-weight:600; }
  .hcol .hp, .hcol .hr, .hcol .hw, .hcol .hs { color:var(--ink-muted); }
  .hlabels { position:sticky; left:0; z-index:2; flex:0 0 72px; background:var(--card); border-right:1px solid var(--border);
             font-size:11px; color:var(--ink-faint); text-align:left; padding-left:8px; white-space:nowrap; }
  .hlabels > div { height:26px; line-height:26px; }
  .hchart { display:block; }
  .tip { position:absolute; pointer-events:none; background:#fff; border:1px solid var(--border-strong); border-radius:8px;
         box-shadow:0 4px 14px rgba(15,27,45,.12); padding:8px 10px; font-size:12px; line-height:1.55; z-index:5;
         white-space:nowrap; display:none; }
  .tip b { font-size:13px; }

  /* 지난 날씨 */
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px; }
  .seg { display:inline-flex; border:1px solid var(--border-strong); border-radius:8px; overflow:hidden; }
  .seg button { border:0; background:var(--card); padding:7px 14px; font-size:13px; cursor:pointer; font-family:inherit; color:var(--ink-muted); }
  .seg button[aria-pressed="true"] { background:var(--navy); color:#fff; }
  .controls input { border:1px solid var(--border-strong); border-radius:8px; padding:6px 10px; font-size:13px; font-family:inherit; color:var(--ink); }
  .btn { border:1px solid var(--border-strong); background:var(--card); border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer; font-family:inherit; }
  .range-note { font-size:12px; color:var(--ink-faint); }
  .range-pick { display:inline-flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:13px; color:var(--ink-muted); }
  .range-pick[hidden] { display:none; }
  .presets { display:inline-flex; gap:4px; flex-wrap:wrap; }
  .btn.sm { padding:4px 9px; font-size:12px; }
  .btn.xl { background:#1D6F42; border-color:#1D6F42; color:#fff; }          /* 엑셀 초록 */
  .btn.xl:disabled { background:var(--card); border-color:var(--border); color:var(--ink-faint); cursor:default; }
  .sum { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .sum div { border:1px solid var(--border); border-radius:8px; padding:8px 12px; background:var(--surface); min-width:104px; }
  .sum small { display:block; font-size:11px; color:var(--ink-faint); }
  .sum b { font-size:16px; }
  .legend { display:flex; gap:14px; font-size:12px; color:var(--ink-muted); margin:4px 0 6px; }
  .legend i { display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:5px; }
  .chart-box { position:relative; }
  table.tbl { width:100%; border-collapse:collapse; font-size:13px; }
  .tbl-wrap { overflow-x:auto; margin-top:12px; border:1px solid var(--border); border-radius:8px; }
  .tbl th { background:#F1F4F9; color:var(--ink-muted); font-weight:600; font-size:12px; padding:7px 8px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--border); }
  .tbl td { padding:6px 8px; text-align:right; border-bottom:1px solid var(--grid); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .tbl th:first-child, .tbl td:first-child { text-align:left; }
  .tbl tr.click { cursor:pointer; } .tbl tr.click:hover td { background:#F7F9FC; }
  .tag { display:inline-block; font-size:11px; border-radius:10px; padding:0 7px; margin-left:4px; }
  .tag.cold { color:var(--cold); background:var(--cold-bg); }
  .tag.rain { color:var(--warn); background:var(--warn-bg); }
  .src { color:var(--ink-faint); font-size:11px; }
  .foot { font-size:11px; color:var(--ink-faint); line-height:1.7; margin-top:8px; }

  @media (max-width:760px) {
    .site-header { padding:0 16px; } .main { padding:16px 16px 40px; }
    .now-wrap { grid-template-columns:1fr; }
    .days { grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; }
    .day { padding:8px 2px; } .day-i { font-size:22px; }
  }
</style>
</head>
<body>
<header class="site-header">
  <div style="display:flex;align-items:center;gap:14px;">
    <a class="back" href="../">← 영남지사</a>
    <div>
      <div class="site-title">날씨 조회</div>
      <div class="site-sub">전국 시·군·구 · 시간대별 예보 · 지난 날씨</div>
    </div>
  </div>
</header>

<main class="main">
  <div class="picker" id="picker">
    <label>시·도<select id="s-sido" aria-label="시·도"></select></label>
    <label>시·군·구<select id="s-si" aria-label="시·군·구"></select></label>
    <label id="l-gu" hidden>구<select id="s-gu" aria-label="구"></select></label>
    <span class="pick-note" id="pick-note"></span>
  </div>

  <section class="card">
    <h2 id="now-title">지금 날씨</h2>
    <div class="desc" id="now-desc">기상청 초단기실황(정시 관측)과 단기예보</div>
    <div class="now-wrap">
      <div class="now" id="now"><div class="empty">관측 자료를 불러오는 중…</div></div>
      <div class="days" id="days"></div>
    </div>
  </section>

  <section class="card">
    <div class="card-head"><h2>시간대별 예보</h2><button class="btn xl" id="fc-xlsx" disabled title="이 지역 시간대별 예보를 엑셀 파일로 받기">⬇ 엑셀 다운로드</button></div>
    <div class="desc" id="fc-desc">기온·하늘·강수확률·강수량·습도·풍속(차트 선택 시 상세)</div>
    <div id="hourly"><div class="empty">예보를 불러오는 중…</div></div>
  </section>

  <section class="card">
    <h2>지난 날씨 조회</h2>
    <div class="desc" id="hist-desc">일·월·기간 단위 과거 기상 기록</div>
    <div class="controls">
      <div class="seg" role="group" aria-label="조회 방식">
        <button id="m-day" aria-pressed="false">하루 보기</button>
        <button id="m-month" aria-pressed="true">한 달 보기</button>
        <button id="m-range" aria-pressed="false">기간 보기</button>
      </div>
      <input type="date" id="q-day" aria-label="날짜" hidden>
      <input type="month" id="q-month" aria-label="달">
      <span class="range-pick" id="q-range" hidden><input type="month" id="q-from" aria-label="시작 달"> ~ <input type="month" id="q-to" aria-label="끝 달">
        <span class="presets"><button class="btn sm" data-p="12">최근 12개월</button><button class="btn sm" data-p="this">올해</button><button class="btn sm" data-p="last">작년</button><button class="btn sm" data-p="all">전체</button></span></span>
      <button class="btn" id="q-prev" aria-label="이전">◀</button>
      <button class="btn" id="q-next" aria-label="다음">▶</button>
      <button class="btn xl" id="q-xlsx" disabled title="지금 보고 있는 지난 날씨를 엑셀 파일로 받기">⬇ 엑셀 다운로드</button>
      <span class="range-note" id="range-note"></span>
    </div>
    <div id="hist"><div class="empty">불러오는 중…</div></div>
    <div class="foot" id="hist-foot"></div>
  </section>
</main>

<script>
/* ═══ 자료 ═══════════════════════════════════════════════════════════════
   ./data/regions.json              전국 시·도/시·군·구/구 — 행정구역코드·예보 격자·가까운 ASOS 지점(weather/tools/build_regions.py)
   ./data/fc/{시도코드}.json         시간대별 예보·오늘~글피 요약(기상청 단기예보, 격자별)
   ./data/obs/{YYYY-MM}/{시도코드}.json 매시간 관측(기상청 초단기실황, 격자별)
   ./data/daily/{지점번호}.json      지난 날씨 일자료(기상청 종관기상관측 ASOS, 2021-01-01~)
   모두 .github/scripts/update_weather.py가 GitHub Actions에서 자동 갱신 */
const BUCKET = Math.floor(Date.now() / 600000);       // 10분마다 새 주소(옛 파일 캐시 방지)
const cache = {};
function getJSON(path) {
  if (!(path in cache)) cache[path] = fetch(`${path}?t=${BUCKET}`, { cache: 'no-cache' })
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return cache[path];
}

const DOW = '일월화수목금토';
const OBS_START = '2026-11-17';       // 전국 시간별 관측(초단기실황)을 쌓기 시작한 날(부산·울산·창원·진주·포항·대구는 11-16부터)
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fmt = (v, u = '', dp = 1) => v == null ? '–' : `${Number(v).toFixed(dp).replace(/\.0$/, '')}${u}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function skyIcon(sky, pty, hour) {
  const p = { 1: ['🌧️', '비'], 2: ['🌨️', '비/눈'], 3: ['❄️', '눈'], 4: ['🌦️', '소나기'], 5: ['🌧️', '빗방울'], 6: ['🌨️', '빗방울·눈날림'], 7: ['❄️', '눈날림'] }[pty];
  if (p) return p;
  const night = hour != null && (hour >= 19 || hour < 6);
  return { 1: [night ? '🌙' : '☀️', '맑음'], 3: [night ? '☁️' : '⛅', '구름많음'], 4: ['☁️', '흐림'] }[sky] || ['', ''];
}
function windDir(deg) {
  if (deg == null) return '';
  return ['북', '북북동', '북동', '동북동', '동', '동남동', '남동', '남남동', '남', '남남서', '남서', '서남서', '서', '서북서', '북서', '북북서'][Math.round(deg / 22.5) % 16] + '풍';
}
const svgEl = (tag, attrs, text) => `<${tag} ${Object.entries(attrs).map(([k, v]) => `${k}="${v}"`).join(' ')}>${text || ''}</${tag}>`;

/* ═══ 지역 선택(시·도 → 시·군·구 → 구) ═════════════════════════════════════ */
let REG = null, office = null;          // office = 고른 지역의 행정구역코드
const sSido = document.getElementById('s-sido'), sSi = document.getElementById('s-si'), sGu = document.getElementById('s-gu'), lGu = document.getElementById('l-gu');
const R = () => REG.byCode[office];     // {code, sido, si, gu, nx, ny, stn, km, g:'nx,ny', sd:'시도코드'}
const city = () => { const r = R(); return r.si ? `${r.sido} ${r.si}${r.gu ? ' ' + r.gu : ''}` : `${r.sido}(대표 지점)`; };
const shortName = () => { const r = R(); return r.gu ? `${r.si} ${r.gu}` : r.si || r.sido; };
async function initRegions() {
  const d = await getJSON('./data/regions.json');
  if (!d) { document.getElementById('pick-note').textContent = '지역 목록을 불러오지 못했습니다.'; return false; }
  const list = d.regions.map(([code, sido, si, gu, nx, ny, lon, lat, stn, km]) => ({ code, sido, si, gu, nx, ny, stn, km, g: `${nx},${ny}`, sd: code.slice(0, 2) }));
  REG = { list, byCode: Object.fromEntries(list.map(r => [r.code, r])), sidos: d.sidos, stations: d.stations };
  sSido.innerHTML = REG.sidos.map(sd => `<option>${esc(sd)}</option>`).join('');
  sSido.onchange = () => pick(firstOf(sSido.value));
  sSi.onchange = () => { const v = sSi.value; pick(v === '' ? repOf(sSido.value).code : (list.find(r => r.sido === sSido.value && r.si === v) || {}).code); };
  sGu.onchange = () => pick(sGu.value);
  return true;
}
const repOf = sido => REG.list.find(r => r.sido === sido && !r.si);
const firstOf = sido => (repOf(sido) || REG.list.find(r => r.sido === sido)).code;
function fillSelects() {
  const r = R(), inSido = REG.list.filter(x => x.sido === r.sido && x.si);
  sSido.value = r.sido;
  const sis = [...new Set(inSido.map(x => x.si))];
  sSi.innerHTML = (repOf(r.sido) ? `<option value="">시·도 대표 지점</option>` : '') + sis.map(si => `<option value="${esc(si)}">${esc(si)}</option>`).join('');
  sSi.value = r.si;
  const gus = inSido.filter(x => x.si === r.si && x.gu);
  lGu.hidden = !gus.length;
  sGu.innerHTML = gus.map(x => `<option value="${x.code}">${esc(x.gu)}</option>`).join('');
  if (gus.length) sGu.value = r.code;
  document.getElementById('pick-note').innerHTML = `<b>${esc(city())}</b> · 예보 격자 ${r.nx},${r.ny} · 지난 날씨는 ${esc(REG.stations[r.stn] || r.stn)} 관측소(${r.km ? `약 ${r.km}km` : '같은 지역'})`;
}
function pick(code) {
  if (!code || !REG.byCode[code]) return;
  office = code;
  try { localStorage.setItem('wx-code', code); } catch (e) { }
  if (location.hash.slice(1) !== code) history.replaceState(null, '', '#' + code);
  fillSelects();
  renderNow(); renderHourly(); renderHist();
}
window.addEventListener('hashchange', () => { const c = location.hash.slice(1); if (c && c !== office) pick(c); });
function fcOf(r) { return getJSON(`./data/fc/${r.sd}.json`).then(d => d && d.grids ? d.grids[r.g] || null : null); }
function obsMonth(r, ym) { return getJSON(`./data/obs/${ym}/${r.sd}.json`).then(d => d && d.grids ? d.grids[r.g] || {} : {}); }
function dailyStn(r) { return getJSON(`./data/daily/${r.stn}.json`).then(d => d && d.days ? d.days : {}); }
const baseText = b => b ? `${+b.slice(4, 6)}/${+b.slice(6, 8)} ${b.slice(8, 10)}:${b.slice(10, 12)} 발표` : '';

/* ═══ 지금 날씨 + 4일 요약 ═══════════════════════════════════════════════ */
async function latestObs() {
  const now = new Date(), months = [ymd(now).slice(0, 7)];
  const prev = new Date(now.getFullYear(), now.getMonth() - 1, 1); months.push(ymd(prev).slice(0, 7));
  for (const ym of months) {
    const rows = await obsMonth(R(), ym);
    const k = Object.keys(rows).sort().pop(); if (k) return [k, rows[k]];
  }
  return null;
}
async function renderNow() {
  const o = office;
  document.getElementById('now-title').textContent = `지금 날씨 · ${shortName()}`;
  const [obs, fc] = await Promise.all([latestObs(), fcOf(R())]);
  if (o !== office) return;
  const box = document.getElementById('now');
  if (obs) {
    const [k, [t, rn, reh, wsd, pty, vec]] = obs;
    const h = +k.slice(8, 10);
    const f = fc && (fc.h || []).find(r => r[0] >= k && +r[0] - +k <= 3);   // 가까운 시각 예보의 하늘상태(관측엔 하늘상태가 없음)
    const [ic, wx] = skyIcon(f ? f[2] : null, pty, h);

/* ═══ 지난 날씨 ═════════════════════════════════════════════════════════ */
let mode = 'month';
const qDay = document.getElementById('q-day'), qMonth = document.getElementById('q-month');
const today = new Date(), yesterday = new Date(today.getFullYear(), today.getMonth(), today.getDate() - 1);
qDay.value = ymd(yesterday); qDay.max = ymd(today); qDay.min = '2021-01-01';
qMonth.value = ymd(today).slice(0, 7); qMonth.max = ymd(today).slice(0, 7); qMonth.min = '2021-01';
const qFrom = document.getElementById('q-from'), qTo = document.getElementById('q-to'), qRange = document.getElementById('q-range');
const MIN_M = '2021-01', MAX_M = ymd(today).slice(0, 7);
const addM = (ym, k) => { const [y, m] = ym.split('-').map(Number); return ymd(new Date(y, m - 1 + k, 1)).slice(0, 7); };
const clampM = ym => ym < MIN_M ? MIN_M : ym > MAX_M ? MAX_M : ym;
const monthsBetween = (a, b) => { const out = []; for (let m = a; m <= b; m = addM(m, 1)) out.push(m); return out; };
[qFrom, qTo].forEach(q => { q.min = MIN_M; q.max = MAX_M; });
qTo.value = MAX_M; qFrom.value = addM(MAX_M, -11);
document.getElementById('m-day').onclick = () => setMode('day');
document.getElementById('m-month').onclick = () => setMode('month');
document.getElementById('m-range').onclick = () => setMode('range');
qDay.onchange = qMonth.onchange = () => renderHist();
qFrom.onchange = qTo.onchange = () => {
  qFrom.value = clampM(qFrom.value || MIN_M); qTo.value = clampM(qTo.value || MAX_M);
  if (qFrom.value > qTo.value) [qFrom.value, qTo.value] = [qTo.value, qFrom.value];
  renderHist();
};
qRange.querySelector('.presets').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const y = today.getFullYear(), p = b.dataset.p;
  if (p === '12') { qTo.value = MAX_M; qFrom.value = addM(MAX_M, -11); }
  else if (p === 'this') { qFrom.value = `${y}-01`; qTo.value = MAX_M; }
  else if (p === 'last') { qFrom.value = `${y - 1}-01`; qTo.value = `${y - 1}-12`; }
  else { qFrom.value = MIN_M; qTo.value = MAX_M; }
  renderHist();
});
document.getElementById('q-prev').onclick = () => step(-1);
document.getElementById('q-next').onclick = () => step(1);
function setMode(m) {
  mode = m;
  document.getElementById('m-day').setAttribute('aria-pressed', m === 'day');
  document.getElementById('m-month').setAttribute('aria-pressed', m === 'month');
  document.getElementById('m-range').setAttribute('aria-pressed', m === 'range');
  qDay.hidden = m !== 'day'; qMonth.hidden = m !== 'month'; qRange.hidden = m !== 'range';
  renderHist();
}
function step(k) {
  if (mode === 'day') { const d = new Date(qDay.value || ymd(yesterday)); d.setDate(d.getDate() + k); if (ymd(d) <= qDay.max && ymd(d) >= qDay.min) qDay.value = ymd(d); }
  else if (mode === 'range') {        // 같은 길이만큼 앞뒤 기간으로
    const n = monthsBetween(qFrom.value, qTo.value).length, f = addM(qFrom.value, k * n), t = addM(qTo.value, k * n);
    if (t < MIN_M || f > MAX_M) return;

  renderHist();
}
async function dailyOf(date) {          // 공식 일자료(ASOS) [평균, 최저, 최고, 강수, 습도, 풍속, 적설]
  return (await dailyStn(R()))[date] || null;
}
async function obsOf(date) {            // 그날 시간별 관측 {HH: [기온, 강수, 습도, 풍속, 강수형태, 풍향]}
  const rows = await obsMonth(R(), date.slice(0, 7)), key = date.replace(/-/g, ''), out = {};
  for (const k in rows) if (k.startsWith(key)) out[k.slice(8, 10)] = rows[k];
  return out;
}
function obsSummary(hours) {            // 관측으로 하루 요약(ASOS 자료가 없을 때)
  const v = Object.values(hours); if (!v.length) return null;
  const t = v.map(r => r[0]).filter(x => x != null), rn = v.map(r => r[1] || 0), rh = v.map(r => r[2]).filter(x => x != null), ws = v.map(r => r[3]).filter(x => x != null);
  const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
  return { avg: avg(t), min: t.length ? Math.min(...t) : null, max: t.length ? Math.max(...t) : null, rain: rn.reduce((s, x) => s + x, 0),
           rh: avg(rh), ws: avg(ws), snow: null, n: v.length };
}
const fromDaily = r => r && { avg: r[0], min: r[1], max: r[2], rain: r[3], rh: r[4], ws: r[5], snow: r[6] };
function tags(s) {
  if (!s) return '';
  return (s.min != null && s.min < 0 ? '<span class="tag cold">영하</span>' : '') + (s.rain != null && s.rain >= 5 ? '<span class="tag rain">비 5mm↑</span>' : '');
}

async function rangeNote() {
  const keys = Object.keys(await dailyStn(R())).sort(), last = keys[keys.length - 1] || null, start = keys[0] || null;
  return last ? `공식 일자료 ${start ? start + ' ' : ''}~ ${last} · 시간별 관측 ${OBS_START}부터`

      ['[Content_Types].xml', HEAD + `<Types xmlns="${NS}package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>`
        + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
        + ct.join('') + '</Types>'],
      ['_rels/.rels', HEAD + `<Relationships xmlns="${NS}package/2006/relationships"><Relationship Id="rId1" Type="${R_NS}/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
      ['xl/workbook.xml', HEAD + `<workbook xmlns="${NS}spreadsheetml/2006/main" xmlns:r="${R_NS}"><bookViews><workbookView activeTab="0"/></bookViews><sheets>${wbSheets.join('')}</sheets></workbook>`],
      ['xl/_rels/workbook.xml.rels', HEAD + `<Relationships xmlns="${NS}package/2006/relationships">${wbRels.join('')}<Relationship Id="rId${sheets.length + 1}" Type="${R_NS}/styles" Target="styles.xml"/></Relationships>`],
      ['xl/styles.xml', STYLES],
      ...files,
    ];
    return zip(all);
  };
})();
document.getElementById('q-xlsx').onclick = async () => {
  if (!lastExport) return;
  const btn = document.getElementById('q-xlsx'), label = btn.textContent;
  const sheets = lastExport.sheets;
  const file = `지난날씨_${shortName().replace(/\s+/g, '')}_${lastExport.period.replace('~', '-')}.xlsx`;
  btn.disabled = true; btn.textContent = '만드는 중…';
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(XLSXW(sheets)); a.download = file;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } finally {
    btn.textContent = label; btn.disabled = !lastExport;
  }
};

document.getElementById('fc-xlsx').onclick = () => {   // 시간대별 예보 → 엑셀
  if (!fcExport) return;
  const r = R(), b = fcExport.base;
  const baseFull = b ? `${b.slice(0, 4)}-${b.slice(4, 6)}-${b.slice(6, 8)} ${b.slice(8, 10)}:${b.slice(10, 12)}` : '';
  const note = `자료: 기상청 단기예보 ${baseFull} 발표 · 예보 격자 ${r.g} · 강수량 「1mm 미만」 등은 기상청 표기 그대로 · 받은 시각 ${nowText()}`;
  const hourly = fcExport.rows.map(x => { const d = new Date(+x[0].slice(0, 4), +x[0].slice(4, 6) - 1, +x[0].slice(6, 8)), h = +x[0].slice(8, 10);
    return [`${d.getMonth() + 1}/${d.getDate()}(${DOW[d.getDay()]}) ${pad(h)}시`, skyIcon(x[2], x[3], h)[1] || '', x[1], x[4], x[5] || '강수없음', x[6], x[7], x[8] || '']; });
  const daily = fcExport.days.map(([d, tmin, tmax, pop, wx]) => { const dt = new Date(d); return [`${dt.getMonth() + 1}/${dt.getDate()}(${DOW[dt.getDay()]})`, wx, tmin, tmax, pop]; });
  const sheets = [
    { name: '시간대별 예보', title: `${placeName()} · 시간대별 예보`, note,
      header: ['일시', '날씨', '기온(°C)', '강수확률(%)', '강수량', '습도(%)', '풍속(m/s)', '적설'], rows: hourly,
      charts: [{ type: 'line', title: '시간대별 기온(°C)', cat: 0, series: [{ col: 2, name: '기온', color: 'EB6834' }] }] },
    ...(daily.length ? [{ name: '일별 요약', title: `${placeName()} · 오늘~글피 예보 요약`, note,
      header: ['날짜', '날씨', '최저기온(°C)', '최고기온(°C)', '최고 강수확률(%)'], rows: daily }] : []),
  ];
  const a = document.createElement('a'); a.href = URL.createObjectURL(XLSXW(sheets));
  a.download = `시간대별예보_${shortName().replace(/\s+/g, '')}_${b ? b.slice(0, 8) + '_' + b.slice(8, 12) : ymd(new Date())}.xlsx`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};

/* ═══ 시작 ═══════════════════════════════════════════════════════════════ */
initRegions().then(ok => {
  if (!ok) return;
  let code = location.hash.slice(1);
  if (!REG.byCode[code]) { try { code = localStorage.getItem('wx-code'); } catch (e) { code = null; } }
  if (!REG.byCode[code]) code = (REG.list.find(r => r.sido.startsWith('부산') && !r.si) || REG.list[0]).code;
  pick(code);
});
</script>
