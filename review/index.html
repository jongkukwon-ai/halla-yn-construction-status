<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06100c">
<link rel="icon" href="../assets/icon-192.png">
<title>영남지사 · 리뷰 작성</title>
<link rel="stylesheet" href="../assets/brand.css">
<style>
  body{background:#0a0d0c}
  .page{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:18px 16px 60px}
  .head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .head h1{font-size:22px;font-weight:500;flex:1}
  a.pill,button{font:inherit;font-size:13px;padding:7px 14px;border-radius:50px;cursor:pointer;text-decoration:none;background:transparent;border:1px solid var(--border);color:var(--text2)}
  button:hover,a.pill:hover{border-color:var(--border2);color:var(--text)}
  button.on{border-color:var(--border2);background:var(--accent-bg);color:var(--accent)}
  button.pri{border-color:rgba(120,205,90,.55);background:rgba(120,205,90,.12);color:#A6DD62}
  button.del{border-color:rgba(230,95,90,.4);color:var(--danger)}
  button:disabled{opacity:.45;cursor:default}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .bar .sp{flex:1}
  input,textarea{font:inherit;font-size:14px;color:var(--text);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:9px;outline:none}
  input{height:36px;padding:0 10px}
  input:focus,textarea:focus{border-color:var(--border2)}
  input:disabled,textarea:disabled{opacity:.75;background:transparent;border-color:var(--border)}
  textarea{width:100%;min-height:110px;padding:10px 12px;line-height:1.6;resize:vertical}
  .inbox{border:1px solid rgba(240,180,80,.5);background:var(--amber-bg);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:13px}
  .inbox b{color:var(--amber)} .inbox button{margin:6px 6px 0 0}
  .card{border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.025);padding:14px;margin-bottom:14px}
  .card h2{font-size:15px;font-weight:500;margin-bottom:4px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .card .sub{font-size:12px;color:var(--text3);margin-bottom:10px}
  .tag{font-size:11.5px;padding:2px 9px;border-radius:50px;border:1px solid var(--border2);color:var(--accent)}
  .tag.req{border-color:rgba(240,180,80,.6);color:var(--amber)}
  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
  th,td{padding:7px 8px;text-align:right;border:1px solid var(--border);white-space:nowrap}
  th{font-weight:500;font-size:12px;color:var(--text2);background:rgba(255,255,255,.03)}
  td:first-child,th:first-child{text-align:left}
  td input{width:92px;text-align:right;height:32px}
  td.calc{color:var(--text2)} td.neg{color:#7FB8E6} td.pos{color:var(--accent)}
  .field{margin-bottom:14px} .field label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px}
  .msg{font-size:13px;min-height:18px;margin:6px 0;color:var(--accent)} .msg.err{color:var(--danger)}
  .empty{padding:30px 0;text-align:center;color:var(--text3);font-size:14px}
  .meta{font-size:12px;color:var(--text3);margin-top:6px}
</style>
</head>
<body>
<div class="brand-bg"><img class="brand-logo" src="../assets/halla_logo.png" alt=""></div>
<div class="page">
  <div class="head">
    <a class="pill" href="../index.html">← 영남지사</a>
    <h1>리뷰 작성</h1>
  </div>

  <div id="inbox" class="inbox" hidden></div>

  <div class="bar">
    <button id="t-weekly" class="on">주간리뷰</button>
    <button id="t-monthly">월간리뷰</button>
    <span class="sp"></span>
    <button id="prev">◀</button>
    <input id="period" type="date">
    <button id="next">▶</button>
  </div>
  <div class="bar" id="offices"></div>
  <div id="body"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NOTES = {
  weekly: [['this_week', 'This Week · 현황 & 영업활동'], ['this_etc', 'This Week · 기타'], ['next_week', 'Next Week · 계획 & 영업활동'], ['next_etc', 'Next Week · 기타']],
  monthly: [['pov', '◎ POV 및 동행방문'], ['analysis', '◎ 판매실적 분석 및 시장상황'], ['issues', '◎ 현안 및 달성방안']],
};
let type = 'weekly', period = '', office = '', data = null;

async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'yn' }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { location.href = '../login.html?next=/review/'; throw new Error(''); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || '처리하지 못했습니다.');
  return d;
}

/* ── 기간 ── */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function monday(s) { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; }
function defaultPeriod() {
  const t = new Date();
  if (type === 'weekly') return ymd(monday(ymd(t)));
  t.setMonth(t.getMonth() - 1); return `${t.getFullYear()}-${pad(t.getMonth() + 1)}`; // 월간은 지난달 실적
}
function setPeriodInput() {
  const el = $('period'); el.type = type === 'weekly' ? 'date' : 'month'; el.value = period;
}
function shift(n) {
  if (type === 'weekly') { const d = monday(period); d.setDate(d.getDate() + 7 * n); period = ymd(d); }
  else { const [y, m] = period.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); period = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; }
  load();
}
const monthOf = s => Number(s.split('-')[1]);
function months() { // [당월, 익월] 숫자
  if (type === 'monthly') { const m = monthOf(period); return [m, m % 12 + 1]; }
  const d = monday(period); const m = d.getMonth() + 1; return [m, m % 12 + 1];
}

/* ── 상단 실적 표 ── */
const num = v => (v === '' || v == null || isNaN(Number(v))) ? null : Number(v);
const fmt = v => v == null ? '' : Math.round(v * 10) / 10 + '';
const pct = (a, b) => (a == null || b == null || b === 0) ? '' : (Math.round((a / b - 1) * 1000) / 10) + '%';
const diff = (a, b) => (a == null || b == null) ? '' : fmt(a - b);
function inp(key, v, edit) { return `<td><input data-k="${key}" inputmode="decimal" value="${esc(v ?? '')}" ${edit ? '' : 'disabled'}></td>`; }
function cls(a, b) { return a == null || b == null ? '' : (a - b < 0 ? 'neg' : 'pos'); }

function perfTable(p, edit) {
  const [m1, m2] = months();
  const g = k => p[k] ?? '';
  if (type === 'weekly') {
    const rows = [['cur', m1], ['next', m2]].map(([k, m]) => {
      const ly = num(g(`w.${k}.ly`)), plan = num(g(`w.${k}.plan`)), mi = num(g(`w.${k}.mi`));
      return `<tr><td>${m}월</td>${inp(`w.${k}.ly`, g(`w.${k}.ly`), edit)}${inp(`w.${k}.plan`, g(`w.${k}.plan`), edit)}${inp(`w.${k}.mi`, g(`w.${k}.mi`), edit)}
        <td class="calc ${cls(mi, ly)}">${pct(mi, ly)}</td><td class="calc ${cls(mi, plan)}">${pct(mi, plan)}</td></tr>`;
    }).join('');
    return `<div class="tw"><table><thead><tr><th>월</th><th>전년실적</th><th>사업계획</th><th>MI</th><th>vs 전년 %</th><th>vs 계획 %</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  const grp = (pre, cols) => ['pc', 'sc'].map(s => cols.map(c => num(g(`${pre}.${s}.${c}`))));
  const sum = (a, b) => a == null && b == null ? null : (a || 0) + (b || 0);
  const block = (pre, label, third, thirdName) => {
    const [pc, sc] = grp(pre, ['ly', 'plan', third]);
    const tot = [0, 1, 2].map(i => sum(pc[i], sc[i]));
    const row = (name, k, v, editable) => {
      const [ly, plan, t] = v;
      const cell = c => editable ? inp(`${pre}.${k}.${c}`, g(`${pre}.${k}.${c}`), edit) : `<td class="calc">${fmt(v[['ly', 'plan', third].indexOf(c)])}</td>`;
      return `<tr><td>${name}</td>${cell('ly')}${cell('plan')}${cell(third)}
        <td class="calc ${cls(t, ly)}">${diff(t, ly)}</td><td class="calc ${cls(t, plan)}">${diff(t, plan)}</td>
        <td class="calc ${cls(t, ly)}">${pct(t, ly)}</td><td class="calc ${cls(t, plan)}">${pct(t, plan)}</td></tr>`;
    };
    return `<tr><th colspan="8" style="text-align:left">${label}</th></tr>${row('PC', 'pc', pc, true)}${row('SC', 'sc', sc, true)}${row('합계', 'tot', tot, false)}`;
  };
  return `<div class="tw"><table><thead><tr><th>구분 (판매물량)</th><th>전년</th><th>계획</th><th>실적/MI</th><th>차이 vs 전년</th><th>차이 vs 계획</th><th>% vs 전년</th><th>% vs 계획</th></tr></thead><tbody>
    ${block('a', `${m1}월 실적`, 'act')}${block('c', `${m1}월 누계`, 'act')}${block('f', `${m2}월 예상 (MI)`, 'mi')}</tbody></table></div>`;
}

/* ── 화면 ── */
async function load() {
  setPeriodInput();
  $('body').innerHTML = '<div class="empty">불러오는 중…</div>';
  try { data = await api('GET', `/api/reviews?type=${type}&period=${period}`); } catch (e) { $('body').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  if (!data.offices.length) { $('offices').innerHTML = ''; $('body').innerHTML = '<div class="empty">이 리뷰를 볼 수 있는 권한이 없습니다.</div>'; return; }
  if (!data.offices.includes(office)) office = data.rights.write_office || data.offices[0];
  $('offices').innerHTML = data.offices.map(o => `<button class="${o === office ? 'on' : ''}" data-o="${esc(o)}">${esc(o)}</button>`).join('');
  render();
}

function render() {
  const rt = data.rights, rv = data.reviews[office] || { perf: {}, notes: {}, status: 'draft' };
  const mine = rt.write_office === office, locked = rv.status === 'requested';
  const canNotes = mine && !locked;
  const title = type === 'weekly' ? `${period} 주 주간리뷰` : `${period.replace('-', '년 ')}월 월간 대면리뷰`;
  const notes = NOTES[type].map(([k, label]) => `<div class="field"><label>${label}</label>
    <textarea data-n="${k}" ${canNotes ? '' : 'disabled'}>${esc(rv.notes[k] || '')}</textarea></div>`).join('');
  $('body').innerHTML = `
    <div class="card"><h2>${esc(office)} 영업소 ${rv.status === 'requested' ? '<span class="tag req">확인요청됨</span>' : ''}</h2>
      <div class="sub">${esc(title)}${rv.requested_at ? ` · 요청 ${esc(rv.requested_at)} ${esc(rv.requested_by)}` : ''}</div>
      <h2 style="font-size:14px">${type === 'weekly' ? '판매계획' : '판매 실적'} <span class="sub" style="margin:0">${rt.perf ? '관리자가 입력합니다 (단위: 톤)' : '관리자가 입력한 값입니다'}</span></h2>
      ${perfTable(rv.perf || {}, rt.perf)}
      <div class="msg" id="msg-perf"></div>
      ${rt.perf ? '<button class="pri" id="save-perf">상단 실적 저장</button>' : ''}
      ${rv.perf_updated_at ? `<div class="meta">실적 입력 ${esc(rv.perf_updated_at)} ${esc(rv.perf_updated_by)}</div>` : ''}
    </div>
    <div class="card"><h2>주요 사항 ${mine ? '' : '<span class="sub" style="margin:0">해당 영업소장이 작성합니다</span>'}</h2>
      ${notes}
      <div class="msg" id="msg-n"></div>
      ${mine ? (locked ? '<button class="del" id="cancel">요청 취소하고 수정</button>'
        : '<button id="save-n">임시저장</button> <button class="pri" id="request">확인요청 (지사장·관리자에게 전달)</button>') : ''}
      ${rv.updated_at ? `<div class="meta">작성 ${esc(rv.updated_at)} ${esc(rv.updated_by)}</div>` : ''}
    </div>`;
  if (rt.perf) $('body').querySelectorAll('[data-k]').forEach(i => i.addEventListener('input', () => livePerf()));
}
function collect() {
  const perf = {}; document.querySelectorAll('[data-k]').forEach(i => { if (i.value.trim() !== '') perf[i.dataset.k] = i.value.trim().replace(/,/g, ''); }); return perf;
}
function livePerf() { // 입력 중에도 차이·% 계산 갱신(저장 전)
  const rv = data.reviews[office] || { perf: {}, notes: {}, status: 'draft' };
  const keep = document.activeElement && document.activeElement.dataset.k, pos = document.activeElement && document.activeElement.selectionStart;
  const tmp = { ...rv, perf: collect() }; data.reviews[office] = tmp;
  const msgs = [...document.querySelectorAll('.msg')].map(e => e.textContent);
  render(); document.querySelectorAll('.msg').forEach((e, i) => e.textContent = msgs[i] || '');
  const el = keep && document.querySelector(`[data-k="${keep}"]`); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} }
}
function notesNow() { const n = {}; document.querySelectorAll('[data-n]').forEach(t => n[t.dataset.n] = t.value); return n; }
const base = () => `/api/reviews/${type}/${period}/${encodeURIComponent(office)}`;
function say(id, t, err) { const el = $(id); if (el) { el.textContent = t; el.className = 'msg' + (err ? ' err' : ''); } }

$('body').addEventListener('click', async e => {
  const id = e.target.id; if (!id) return;
  try {
    if (id === 'save-perf') { await api('PUT', base() + '/perf', { perf: collect() }); await reload('msg-perf', '상단 실적을 저장했습니다.'); }
    if (id === 'save-n') { await api('PUT', base() + '/notes', { notes: notesNow() }); await reload('msg-n', '임시저장했습니다.'); }
    if (id === 'request') {
      if (!confirm('지사장과 관리자에게 확인요청을 보낼까요?\n요청 후에는 취소해야 고칠 수 있습니다.')) return;
      await api('POST', base() + '/request', { notes: notesNow() }); await reload('msg-n', '확인요청을 보냈습니다.'); inbox();
    }
    if (id === 'cancel') { await api('POST', base() + '/cancel', {}); await reload('msg-n', '요청을 취소했습니다. 수정 후 다시 요청해 주세요.'); inbox(); }
  } catch (err) { if (err.message) say(id === 'save-perf' ? 'msg-perf' : 'msg-n', err.message, true); }
});
async function reload(msgId, text) { data = await api('GET', `/api/reviews?type=${type}&period=${period}`); render(); say(msgId, text); }

$('offices').addEventListener('click', e => { if (e.target.dataset.o) { office = e.target.dataset.o; load(); } });
$('prev').onclick = () => shift(-1); $('next').onclick = () => shift(1);
$('period').onchange = e => { if (!e.target.value) return; period = type === 'weekly' ? ymd(monday(e.target.value)) : e.target.value; load(); };
function setType(t) { type = t; $('t-weekly').classList.toggle('on', t === 'weekly'); $('t-monthly').classList.toggle('on', t === 'monthly'); period = defaultPeriod(); load(); }
$('t-weekly').onclick = () => setType('weekly'); $('t-monthly').onclick = () => setType('monthly');

/* 확인요청 받은 리뷰(지사장·관리자) */
async function inbox() {
  try {
    const { items } = await api('GET', '/api/reviews/inbox'); const el = $('inbox');
    if (!items.length) { el.hidden = true; return; }
    el.hidden = false;
    el.innerHTML = `<b>확인요청 ${items.length}건</b>` + '<br>' + items.map((r, i) => `<button data-i="${i}">${r.type === 'weekly' ? '주간' : '월간'} ${esc(r.period)} · ${esc(r.office)} · ${esc(r.requested_at)}</button>`).join('');
    el.onclick = e => { const r = items[e.target.dataset.i]; if (!r) return; type = r.type; office = r.office; period = r.period;
      $('t-weekly').classList.toggle('on', type === 'weekly'); $('t-monthly').classList.toggle('on', type === 'monthly'); load(); };
  } catch (e) {}
}
period = defaultPeriod(); load(); inbox();
</script>
</body>
</html>
