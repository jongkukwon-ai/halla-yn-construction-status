name: 업종 뉴스 카카오톡 아침 발송

# 정시 실행: 외부 예약(cron-job.org)이 매일 07:00에 이 작업을 실행 → 뉴스 갱신(약 1분) → 07:30까지 기다렸다가 발송
# GitHub 자체 예약(07:30)은 예비 — 실제로는 2시간가량 늦게 돌 때가 많아, 오늘 이미 보냈으면 건너뜀(중복 발송 방지)
on:
  schedule:
    - cron: '30 22 * * *'    # 07:30 KST (UTC 22:30) — 예비
  workflow_dispatch:
    inputs:
      force:
        description: '오늘 이미 보냈어도 다시 보내기(시험용)'
        type: boolean
        default: false

permissions:
  contents: write            # 뉴스 갱신 결과 저장
  actions: read              # 오늘 발송 여부 확인

concurrency:
  group: kakao-news
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 50        # 07:00 시작 → 07:30 발송까지 대기 포함
    steps:
      - name: 오늘 이미 보냈는지 확인
        id: dup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d "$(TZ=Asia/Seoul date +%F) 00:00 +0900" +%FT%TZ)    # 오늘 0시(KST)
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/kakao.yml/runs?status=success&created=%3E%3D$since&per_page=1" --jq .total_count)
          if [ "$n" -gt 0 ]; then
            echo "오늘 이미 발송함 — 건너뜀"; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.dup.outputs.skip != 'true'
        with:
          ref: main

      - uses: actions/setup-python@v5
        if: steps.dup.outputs.skip != 'true'
        with:
          python-version: '3.12'

      - name: 뉴스 갱신(발송 직전 최신 기사)
        if: steps.dup.outputs.skip != 'true'
        run: |
          python .github/scripts/update_news.py
          if git diff --quiet -- news-data.js; then
            echo "변경 없음"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-data.js
          git commit -m "업종 관련 뉴스 자동 갱신 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

      - name: 07:30까지 대기
        if: steps.dup.outputs.skip != 'true'
        run: |
          now=$(date +%s)
          target=$(date -d "$(TZ=Asia/Seoul date +%F) 07:30 +0900" +%s)
          if [ "$now" -lt "$target" ] && [ $((target - now)) -le 3600 ]; then   # 07:30 전 1시간 안에 시작했을 때만
            echo "$(( (target - now) / 60 ))분 대기 후 발송"; sleep $((target - now))
          fi

      - run: pip install pynacl   # 리프레시 토큰 자동 교체(GH_PAT 있을 때)용
        if: steps.dup.outputs.skip != 'true'

      - name: 카카오톡 발송
        if: steps.dup.outputs.skip != 'true'
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_RECIPIENTS: ${{ secrets.KAKAO_RECIPIENTS }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python .github/scripts/send_kakao_news.py
