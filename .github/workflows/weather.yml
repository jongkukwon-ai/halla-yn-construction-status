name: 영업소 권역 날씨 갱신

on:
  schedule:
    - cron: '35 20,2,8,14 * * *'   # 하루 4번 05:35·11:35·17:35·23:35 KST (기상청 05·11·17·23시 발표 뒤)
  workflow_dispatch: {}             # Actions 탭에서 바로 실행
  push:                             # 날씨 스크립트·설정을 고치면 바로 한 번 갱신
    branches: [main]
    paths:
      - '.github/scripts/update_weather.py'
      - '.github/workflows/weather.yml'

permissions:
  contents: write

concurrency:
  group: weather-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 기상청 단기예보로 weather-data.js 갱신
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python .github/scripts/update_weather.py

      - name: 변경 시 커밋·푸시
        run: |
          if git diff --quiet -- weather-data.js; then
            echo "변경 없음"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather-data.js
          git commit -m "영업소 권역 날씨 갱신 $(TZ=Asia/Seoul date '+%F %H:%M')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
