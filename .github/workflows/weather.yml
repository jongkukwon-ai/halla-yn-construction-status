name: 영업소 권역 날씨 갱신

on:
  schedule:
    # 매시간 2번(:07·:37) — GitHub가 예약 실행을 자주 건너뛰어(실측 하루 5~6회만 실행) 기회를 늘림
    # 기상청 단기예보는 3시간마다 발표, 예보 내용이 바뀔 때만 커밋하므로 실행이 많아도 기록은 늘지 않음
    - cron: '7,37 * * * *'
  workflow_dispatch: {}             # Actions 탭에서 바로 실행 + 외부 정시 실행(cron-job.org 매시 20분, 날씨_정시실행_설정.md)
  push:                             # 날씨 스크립트·설정을 고치면 바로 한 번 갱신
    branches: [main]
    paths:
      - '.github/scripts/update_weather.py'
      - '.github/workflows/weather.yml'

permissions:
  contents: write

concurrency:
  group: weather-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 기상청 단기예보로 weather-data.js 갱신
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python .github/scripts/update_weather.py

      - name: 변경 시 커밋·푸시
        run: |
          # 확인 시각(updated)만 바뀐 경우는 커밋하지 않음 — 예보 내용이 바뀔 때만 저장
          if ! git diff -U0 -- weather-data.js | grep "^[-+]" | grep -Ev "^(---|\+\+\+) " | grep -qv "\"updated\""; then
            echo "변경 없음"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather-data.js
          git commit -m "영업소 권역 날씨 갱신 $(TZ=Asia/Seoul date '+%F %H:%M')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
