<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="영남지사">
  <meta name="theme-color" content="#06100c">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="icon" href="./assets/icon-192.png">
  <title>영남지사</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{min-height:100vh}
    body{
      width:100vw;
      background:
        radial-gradient(circle at 82% 12%, rgba(0,135,90,0.14), transparent 45%),
        radial-gradient(circle at 12% 88%, rgba(158,216,74,0.08), transparent 42%),
        #06100c;
      font-family:system-ui,-apple-system,sans-serif;
    }

    /* ── 로고 워터마크 ── */
    #bg-logo{
      position:fixed;top:8%;right:5%;width:min(34vw,420px);height:auto;
      opacity:.08;z-index:1;pointer-events:none;user-select:none;
    }

    /* ── 히어로 (타이틀 + 바로가기 칸) ── */
    #hero{
      position:relative;z-index:10;
      display:flex;flex-direction:column;align-items:center;gap:22px;
      text-align:center;padding:56px 16px 34px;
    }
    #pw-name{
      font-size:clamp(40px,10vw,84px);font-weight:800;letter-spacing:-.02em;
      color:rgba(255,255,255,0.92);line-height:1;
    }
    #pw-name span{display:block;font-size:clamp(11px,1.6vw,15px);letter-spacing:.3em;text-transform:uppercase;color:rgba(158,216,74,0.6);margin-top:12px;font-weight:500}

    /* ── 설치 버튼 ── */
    #install-btn{
      position:fixed;top:max(16px,env(safe-area-inset-top));right:16px;
      background:rgba(78,214,144,0.13);border:.5px solid rgba(78,214,144,0.4);
      color:rgba(150,230,180,0.85);padding:6px 14px;border-radius:50px;
      font-size:12px;cursor:pointer;font-family:inherit;
      z-index:20;display:none;transition:background .2s
    }
    #install-btn:hover{background:rgba(78,214,144,0.25)}

    /* ── 메뉴 버튼 ── */
    #menu-btn{
      position:fixed;bottom:max(20px,env(safe-area-inset-bottom));right:16px;
      background:rgba(78,214,144,0.1);border:.5px solid rgba(78,214,144,0.28);
      color:rgba(150,230,180,0.85);padding:9px 16px;border-radius:50px;
      font-size:13px;cursor:pointer;font-family:inherit;
      z-index:20;text-decoration:none;transition:all .2s;
    }
    #menu-btn:hover{background:rgba(78,214,144,0.2)}

    /* ── 바로가기 칸 (클릭 이동) ── */
    #quick-nav{
      display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:92vw;
    }
    .nav-box{
      width:clamp(160px,42vw,220px);
      display:flex;flex-direction:column;align-items:center;gap:3px;
      padding:14px 10px;border-radius:16px;
      background:rgba(255,255,255,0.05);border:.5px solid rgba(255,255,255,0.14);
      text-decoration:none;color:rgba(255,255,255,0.85);
      text-align:center;
      transition:all .2s;cursor:pointer;
    }
    .nav-box:hover{background:rgba(78,214,144,0.12);border-color:rgba(78,214,144,0.45);transform:translateY(-2px)}
    .nav-box-icon{font-size:22px}
    .nav-box-title{font-size:13px;font-weight:600;margin-top:2px;white-space:nowrap}
    .nav-box-desc{font-size:10px;color:rgba(255,255,255,0.4)}

    /* ── 건설뉴스 ── */
    #news-wrap{
      position:relative;z-index:10;
      max-width:1100px;margin:0 auto;padding:0 20px 56px;
    }
    .news-panel{
      display:grid;grid-template-columns:2fr 1fr;gap:14px;
    }
    .news-main,.news-side{
      background:rgba(255,255,255,0.045);
      border:.5px solid rgba(255,255,255,0.13);
      border-radius:16px;padding:18px 20px;
    }
    .news-panel-title{
      display:flex;align-items:baseline;justify-content:space-between;
      font-size:13.5px;font-weight:700;color:rgba(158,216,74,0.85);
      margin-bottom:12px;letter-spacing:.02em;
    }
    .news-updated{font-size:10.5px;font-weight:400;color:rgba(255,255,255,0.32)}
    .news-list{display:flex;flex-direction:column}
    .news-item{padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.08)}
    .news-item:last-child{border-bottom:none;padding-bottom:0}
    .news-item a{
      color:rgba(255,255,255,0.88);font-weight:600;font-size:13.5px;
      text-decoration:none;line-height:1.45;
    }
    .news-item a:hover{color:rgba(158,216,74,0.95);text-decoration:underline}
    .news-meta{font-size:11px;color:rgba(255,255,255,0.35);margin-top:4px}
    .news-side-list{list-style:none}
    .news-side-list li{padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.08)}
    .news-side-list li:last-child{border-bottom:none;padding-bottom:0}
    .news-side-list a{
      color:rgba(255,255,255,0.55);text-decoration:none;
      font-size:12px;line-height:1.45;
    }
    .news-side-list a:hover{color:rgba(158,216,74,0.9);text-decoration:underline}

    @media (max-width:900px){ .news-panel{ grid-template-columns:1fr; } }
    @media (max-width:700px){ #hero{ padding-top:40px; } }
  </style>
</head>
<body>

<img id="bg-logo" src="./assets/halla_logo.png" alt="HALLA CEMENT">

<button id="install-btn">⬇ 앱 설치</button>
<a href="./menu.html" id="menu-btn">☰ 메뉴</a>

<div id="hero">
  <div id="pw-name">영남지사<span>HALLA CEMENT</span></div>

  <div id="quick-nav">
    <a href="./construction/index.html" class="nav-box">
      <span class="nav-box-icon">🏗️</span>
      <span class="nav-box-title">영남지역 아파트 착공현황</span>
    </a>
  </div>
</div>

<!-- 건설뉴스 -->
<div id="news-wrap">
  <div class="news-panel">
    <div class="news-main">
      <div class="news-panel-title">
        🏗️ 영남지역 건설뉴스
        <span class="news-updated" id="news-updated-label"></span>
      </div>
      <div class="news-list" id="news-main-list"></div>
    </div>
    <div class="news-side">
      <div class="news-panel-title">그 외 지역 소식</div>
      <ul class="news-side-list" id="news-side-list"></ul>
    </div>
  </div>
</div>

<script src="./news-data.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   건설뉴스 렌더링 (데이터는 news-data.js — 매일 자동 갱신됨)
═══════════════════════════════════════════════════════════════ */
function renderNews() {
  if (typeof NEWS_YN === 'undefined') return;
  document.getElementById('news-updated-label').textContent = `기준 ${NEWS_UPDATED}`;

  document.getElementById('news-main-list').innerHTML = NEWS_YN.map(n => `
    <div class="news-item">
      <a href="${n.url}" target="_blank" rel="noopener noreferrer">${n.title}</a>
      <div class="news-meta">${n.source}${n.date ? ' · ' + n.date : ''}</div>
    </div>`).join('');

  document.getElementById('news-side-list').innerHTML = NEWS_OTHER.map(n => `
    <li><a href="${n.url}" target="_blank" rel="noopener noreferrer">${n.title}</a></li>`).join('');
}
renderNews();

/* ═══════════════════════════════════════════════════════════════
   서비스워커 등록
═══════════════════════════════════════════════════════════════ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

/* ═══════════════════════════════════════════════════════════════
   PWA 설치 프롬프트
═══════════════════════════════════════════════════════════════ */
let deferredPrompt = null;
const installBtn = document.getElementById('install-btn');

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'block';
});

installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted') installBtn.style.display = 'none';
  deferredPrompt = null;
});

window.addEventListener('appinstalled', () => {
  installBtn.style.display = 'none';
  deferredPrompt = null;
});
</script>
</body>
</html>
