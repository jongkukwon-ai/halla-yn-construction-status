<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="영남지사">
  <meta name="theme-color" content="#06100c">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="icon" href="./assets/icon-192.png">
  <title>영남지사</title>
  <link rel="stylesheet" href="./assets/brand.css">
  <style>
    /* ── 설치 버튼 (브랜드 카드 스타일 위에 얹는 유틸리티) ── */
    #install-btn{
      position:fixed;top:max(16px,env(safe-area-inset-top));right:16px;
      background:var(--accent-bg);border:.5px solid var(--border2);
      color:var(--accent);padding:6px 14px;border-radius:50px;
      font-size:12px;cursor:pointer;font-family:var(--font);
      z-index:20;display:none;transition:background .2s
    }
    #install-btn:hover{background:rgba(78,214,144,0.25)}
  </style>
</head>
<body>

<div class="brand-bg">
  <img class="brand-logo" src="./assets/halla_logo.png" alt="HALLA CEMENT">
</div>

<button id="install-btn">⬇ 앱 설치</button>

<div class="page-wrap">

  <div class="hero">
    <div class="hero-eyebrow">HALLA CEMENT · YEONGNAM BRANCH</div>
    <div class="hero-title">영남지사 업무 시스템</div>
    <div class="hero-sub">
      부산·양산·울산·경남·경북·대구 아파트 착공 현장을<br class="hide-mobile">
      지역·상태·건설사별로 조회합니다.
    </div>
    <div class="office-chips">
      <span class="office-chip">부산</span>
      <span class="office-chip">울산</span>
      <span class="office-chip">경남동부</span>
      <span class="office-chip">경남서부</span>
      <span class="office-chip">경북동부</span>
      <span class="office-chip">경북서부</span>
    </div>
  </div>

  <div class="nav-grid">
    <a class="nav-card" href="./construction/index.html">
      <div class="nav-card-icon">🏗️</div>
      <div class="nav-card-title">영남지역 아파트 착공현황</div>
      <div class="nav-card-desc">부산·양산·울산·경남·경북·대구 아파트 착공 현장을 지역·상태·건설사별로 조회합니다.</div>
      <span class="nav-card-badge">수시 조회</span>
    </a>
    <a class="nav-card" href="./news/index.html">
      <div class="nav-card-icon">🗞️</div>
      <div class="nav-card-title">건설뉴스</div>
      <div class="nav-card-desc">영남지역 중심 건설·부동산 뉴스를 최신순으로 모아봅니다. 검색으로 다른 기사도 찾을 수 있습니다.</div>
      <span class="nav-card-badge">매일 자동 갱신</span>
    </a>
  </div>

</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   서비스워커 등록
═══════════════════════════════════════════════════════════════ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

/* ═══════════════════════════════════════════════════════════════
   PWA 설치 프롬프트
═══════════════════════════════════════════════════════════════ */
let deferredPrompt = null;
const installBtn = document.getElementById('install-btn');

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'block';
});

installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted') installBtn.style.display = 'none';
  deferredPrompt = null;
});

window.addEventListener('appinstalled', () => {
  installBtn.style.display = 'none';
  deferredPrompt = null;
});
</script>
</body>
</html>
