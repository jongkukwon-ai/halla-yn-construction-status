<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06100c">
<link rel="icon" href="../assets/icon-192.png">
<title>월간 대면리뷰 — 영남지사</title>
<link rel="stylesheet" href="../assets/brand.css">
<style>
  /* ── 잠금 오버레이 (대상월 미선택 시) ── */
  .locked{opacity:.35;pointer-events:none;filter:grayscale(.4)}
  .lock-hint{font-size:12px;color:var(--amber);margin-top:6px}

  /* ── PPT 업로드 ── */
  .ppt-drop{
    border:1.5px dashed var(--border);border-radius:var(--radius-sm);
    padding:28px 16px;text-align:center;cursor:pointer;transition:all .2s;
    background:var(--bg3);
  }
  .ppt-drop:hover{border-color:var(--border2);background:rgba(78,214,144,0.05)}
  .ppt-drop.has-file{padding:18px 16px}
  #ppt-empty{color:var(--text3);font-size:13px}
  #ppt-name{font-size:14px;font-weight:600;color:var(--text)}
  #ppt-meta{font-size:11px;color:var(--text3);margin-top:3px}

  /* ── 전역 회의 녹음 바 ── */
  .global-rec-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .global-rec-status{font-size:13px;color:var(--text2);font-weight:500}
  .global-rec-status.on{color:var(--danger)}
  .global-rec-status.on::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);margin-right:7px;animation:rec-pulse-dot 1.1s ease-in-out infinite}
  .global-rec-status.paused{color:var(--amber)}
  .global-rec-actions{display:flex;gap:8px;flex-wrap:wrap}
  @keyframes rec-pulse-dot{0%,100%{opacity:1}50%{opacity:.25}}
  #rec-live-caption{
    margin-top:12px;padding:10px 14px;border-radius:var(--radius-sm);
    background:var(--bg3);border:.5px solid var(--border);
    font-size:13px;line-height:1.6;color:var(--text2);min-height:1.6em;
  }
  #rec-live-caption b{color:var(--text3);font-weight:500;font-size:11px;letter-spacing:.04em;text-transform:uppercase;display:block;margin-bottom:4px}
  #rec-live-caption.interim{color:var(--text3);font-style:italic}

  /* ── 안건 카드 ── */
  .agenda-card{margin-bottom:16px}
  .agenda-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .agenda-title{font-size:15px;font-weight:600;color:var(--text)}
  .section-pick-btn{
    display:none;align-items:center;gap:7px;padding:8px 16px;border-radius:50px;
    background:var(--bg3);border:.5px solid var(--border);color:var(--text2);
    font-size:12px;cursor:pointer;font-family:var(--font);transition:all .2s;white-space:nowrap;
  }
  .section-pick-btn:hover{background:rgba(255,255,255,0.09)}
  .section-pick-btn.current{background:rgba(230,95,90,0.15);border-color:rgba(230,95,90,0.5);color:var(--danger);cursor:default}
  .section-pick-btn:disabled{cursor:default}
  .agenda-transcript{width:100%;min-height:80px;font-size:13px;line-height:1.6;
    background:var(--bg3);border:.5px solid var(--border);border-radius:var(--radius-sm);
    color:var(--text);padding:10px 12px;font-family:var(--font);resize:vertical;outline:none}
  .agenda-transcript:focus{border-color:var(--border2)}
  .summarize-row{display:flex;align-items:center;gap:10px;margin:10px 0;flex-wrap:wrap}
  .sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:640px){.sum-grid{grid-template-columns:1fr}}
  .sum-box label{font-size:11px;color:var(--text3);letter-spacing:.04em;text-transform:uppercase;display:block;margin-bottom:5px}
  .sum-box textarea{width:100%;min-height:110px;font-size:13px;line-height:1.6;
    background:rgba(78,214,144,0.05);border:.5px solid rgba(78,214,144,0.2);border-radius:var(--radius-sm);
    color:var(--text);padding:10px 12px;font-family:var(--font);resize:vertical;outline:none}
  .sum-box.mgmt textarea{background:rgba(240,180,80,0.06);border-color:rgba(240,180,80,0.25)}

  /* select 드롭다운 목록은 OS가 흰 배경으로 그리는 경우가 많아 글자색을 검정으로 고정 */
  #mo-time{color:var(--text)}
  #mo-time option{color:#111;background:#fff}

  /* ── PPT 발췌: 주요 안건 및 현안 ── */
  .agenda-box{margin-bottom:12px}
  .agenda-box label{font-size:11px;color:var(--text3);letter-spacing:.04em;text-transform:uppercase;display:block;margin-bottom:5px}
  .agenda-box label span{text-transform:none;letter-spacing:0;color:var(--text3);font-weight:400}
  .agenda-box textarea{width:100%;min-height:90px;font-size:13px;line-height:1.6;
    background:rgba(100,160,220,0.06);border:.5px solid rgba(100,160,220,0.25);border-radius:var(--radius-sm);
    color:var(--text);padding:10px 12px;font-family:var(--font);resize:vertical;outline:none}
</style>
</head>
<body>

<div class="brand-bg"><img class="brand-logo" src="../assets/halla_logo.png" alt="HALLA CEMENT"></div>

<div class="top-bar">
  <div class="top-bar-left">
    <a href="../index.html" class="back-btn">← 영남지사</a>
    <span class="top-title">월간 대면리뷰 · 지사회의 회의록</span>
  </div>
  <span class="top-badge" id="period-badge">-</span>
</div>

<div class="page-wrap">

  <!-- 기간 설정 -->
  <div class="card">
    <div class="card-title">회의 정보</div>
    <div class="form-grid">
      <div class="field">
        <label>대상 월</label>
        <input type="month" id="mo-month" onchange="onMonthChange()">
      </div>
      <div class="field">
        <label>회의일자</label>
        <input type="date" id="mo-date">
      </div>
      <div class="field">
        <label>시작 시간</label>
        <select id="mo-time"></select>
      </div>
      <div class="field">
        <label>장소</label>
        <input type="text" id="mo-place" placeholder="예) 영남지사 회의실">
      </div>
    </div>
    <div class="field" style="margin-top:12px">
      <label>참석자</label>
      <input type="text" id="mo-attendees" placeholder="예) 지사장 홍길동, 부산 김대리, 울산 이과장, ...">
    </div>
  </div>

  <div id="locked-hint" class="lock-hint">☝️ 먼저 대상 월을 선택하면 PPT 업로드와 회의록 작성이 열립니다.</div>

  <div id="unlockable">

    <!-- PPT 업로드 -->
    <div class="card">
      <div class="card-title">지사회의 PPT <span>월 실적·계획 등 종합 자료</span></div>
      <div id="ppt-drop" class="ppt-drop" onclick="document.getElementById('ppt-input').click()">
        <div id="ppt-empty">📎 클릭하여 PPT 파일 선택 (.ppt, .pptx)</div>
        <div id="ppt-info" style="display:none">
          <div id="ppt-name"></div>
          <div id="ppt-meta"></div>
          <div class="btn-row" style="margin-top:10px;justify-content:center">
            <a id="ppt-open" class="btn btn-secondary btn-sm" target="_blank" onclick="event.stopPropagation()">파일 열기</a>
            <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();extractPPTPoints()">🪄 안건별 요점 (다시) 추출</button>
            <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();removePPT()">삭제</button>
          </div>
        </div>
      </div>
      <div id="ppt-extract-status" class="hint" style="text-align:center;margin-top:8px"></div>
      <input type="file" id="ppt-input" accept=".ppt,.pptx,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.ms-powerpoint" style="display:none" onchange="onPPTSelected(event)">
    </div>

    <!-- 전역 회의 녹음 -->
    <div class="card">
      <div class="card-title">회의 음성 녹음 <span>한 번만 시작하면 안건이 바뀌어도 계속 진행돼요</span></div>
      <div class="global-rec-bar">
        <div class="global-rec-status" id="rec-status">녹음 대기 중</div>
        <div class="global-rec-actions" id="rec-actions">
          <button class="btn btn-primary btn-sm" onclick="startMeetingRecording()">🎤 회의 녹음 시작</button>
        </div>
      </div>
      <div id="rec-live-caption" style="display:none"></div>
    </div>

    <!-- 외부 녹음 텍스트 붙여넣기 -->
    <div class="card">
      <div class="card-title">녹음 텍스트 붙여넣기 <span>아이폰 음성메모 등 외부에서 받아쓴 전체 회의 텍스트</span></div>
      <textarea class="agenda-transcript" id="paste-transcript" style="min-height:120px"
        placeholder="아이폰 음성메모(iOS 17+ 자동 받아쓰기) 등에서 복사한 회의 전체 텍스트를 여기에 통째로 붙여넣으세요. AI가 안건별로 자동 분류해서 각 안건의 '녹음 원문' 칸에 나눠 넣어줍니다."></textarea>
      <div class="summarize-row">
        <button class="btn btn-secondary btn-sm" id="pastebtn" onclick="classifyPastedTranscript()">🪄 안건별로 자동 분류해서 넣기</button>
        <span class="hint" id="pastehint"></span>
      </div>
    </div>

    <!-- 안건별 음성 녹음 -->
    <div id="agenda-wrap"></div>

    <div class="card">
      <div class="btn-row" style="justify-content:flex-end">
        <button class="btn btn-secondary" onclick="clearForm()">초기화</button>
        <button class="btn btn-secondary" onclick="summarizeAllSections()" id="summarize-all-btn">🪄 전체 안건 자동 요점 정리</button>
        <button class="btn btn-lime" onclick="copyMinutes()">📋 회의록 텍스트 복사</button>
        <button class="btn btn-lime" onclick="downloadWordMinutes()">⬇ 회의록 워드파일 다운로드</button>
        <button class="btn btn-primary" onclick="saveRecord()">회의록 저장</button>
      </div>
    </div>

  </div>

  <!-- 저장 이력 -->
  <div class="card">
    <div class="card-title">저장된 회의록 이력 <span id="hist-count" class="badge">0건</span></div>
    <div id="hist-list"><div class="empty"><div class="empty-icon">📭</div>저장된 지사회의 회의록이 없어요.</div></div>
  </div>

</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
const OFFICES = ['부산','울산','경남동부','경남서부','경북동부','경북서부'];
const STORE_KEY = 'yn_monthly_minutes';
const DB_NAME = 'yn_monthly_files', DB_STORE = 'ppt';

// SAFETY CONTACT은 회의록 작성 대상에서 제외합니다
const AGENDA = [
  { key:'perf',   title:'월 실적' },
  { key:'plan',   title:'판매계획 검토', dynamicMonth:true },
  { key:'issues', title:'영업소별 현안 점검' },
  { key:'tsr',    title:'TSR 현황 및 이슈' },
  { key:'notice', title:'전달사항' },
];

let CLAUDE_KEY = localStorage.getItem('jkwon_claude_key') || '';
let currentMonthId = '';   // 레코드 키 = 대상월(YYYY-MM)
let currentPPTUrl = null;  // 현재 세션에서 만든 blob URL (해제용)

/* ── 안건 카드 렌더 ── */
function agendaTitle(a){
  if (!a.dynamicMonth) return a.title;
  const m = document.getElementById('mo-month').value;
  if (!m) return a.title;
  let [y, mo] = m.split('-').map(Number);
  mo += 1; if (mo > 12) { mo = 1; y += 1; }
  return `${mo}월 ${a.title}`;
}

function renderAgendaTitles(){
  AGENDA.forEach(a=>{
    const el = document.getElementById('title-'+a.key);
    if (el) el.textContent = agendaTitle(a);
  });
}

function buildAgenda(){
  document.getElementById('agenda-wrap').innerHTML = AGENDA.map(a => `
    <div class="card agenda-card" data-key="${a.key}">
      <div class="agenda-head">
        <div class="agenda-title" id="title-${a.key}">${agendaTitle(a)}</div>
        <button class="section-pick-btn" id="pick-${a.key}" onclick="setActiveSection('${a.key}')">📍 이 안건으로 전환</button>
      </div>
      <div class="agenda-box">
        <label>주요 안건 및 현안 <span>· PPT에서 자동 추출</span></label>
        <textarea id="sum-agenda-${a.key}" placeholder="PPT를 업로드하면 이 안건과 관련된 주요 내용이 자동으로 채워집니다."></textarea>
      </div>
      <textarea class="agenda-transcript" id="tx-${a.key}" placeholder="녹음 버튼을 누르고 논의 내용을 말하면 실시간으로 받아써집니다. 직접 입력·수정도 가능합니다."></textarea>
      <div class="summarize-row">
        <button class="btn btn-secondary btn-sm" id="sumbtn-${a.key}" onclick="summarizeSection('${a.key}')">🪄 AI로 요점 정리</button>
        <span class="hint" id="sumhint-${a.key}"></span>
      </div>
      <div class="sum-grid">
        <div class="sum-box">
          <label>영업소별 이슈 <span style="text-transform:none;letter-spacing:0">· 녹음 내용 기반</span></label>
          <textarea id="sum-office-${a.key}" placeholder="예)\n- 부산: ...\n- 울산: ..."></textarea>
        </div>
        <div class="sum-box mgmt">
          <label>지사장 · 경영진 전달사항 <span style="text-transform:none;letter-spacing:0">· 녹음 내용 기반</span></label>
          <textarea id="sum-mgmt-${a.key}" placeholder="- ..."></textarea>
        </div>
      </div>
    </div>
  `).join('');
  updateSumHints();
  updateSectionButtons();
}

function updateSumHints(){
  AGENDA.forEach(a=>{
    const hint = document.getElementById('sumhint-'+a.key);
    hint.textContent = CLAUDE_KEY ? '' : 'Claude API 키가 있어야 자동 요약이 가능해요 (영남지사 시작화면 ⚙에서 설정)';
  });
  const pasteHint = document.getElementById('pastehint');
  if (pasteHint) pasteHint.textContent = CLAUDE_KEY ? '' : 'Claude API 키가 있어야 자동 분류가 가능해요 (영남지사 시작화면 ⚙에서 설정)';
}

/* ── 잠금/해제 ── */
function refreshLock(){
  const m = document.getElementById('mo-month').value;
  const unlockable = document.getElementById('unlockable');
  const hint = document.getElementById('locked-hint');
  if (m) {
    unlockable.classList.remove('locked');
    hint.style.display = 'none';
  } else {
    unlockable.classList.add('locked');
    hint.style.display = 'block';
  }
}

function onMonthChange(){
  const m = document.getElementById('mo-month').value;
  currentMonthId = m;
  refreshLock();
  updatePeriodBadge();
  renderAgendaTitles();
  loadPPTDisplay();
}

function updatePeriodBadge(){
  const m = document.getElementById('mo-month').value;
  document.getElementById('period-badge').textContent = m || '-';
}

/* ── IndexedDB (PPT 파일 저장) ── */
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore(DB_STORE);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror   = ()=> reject(req.error);
  });
}
async function savePPTFile(id, file){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(DB_STORE,'readwrite');
    tx.objectStore(DB_STORE).put({file, name:file.name, size:file.size, savedAt:new Date().toISOString()}, id);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
async function loadPPTFile(id){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(DB_STORE,'readonly');
    const req = tx.objectStore(DB_STORE).get(id);
    req.onsuccess = ()=>resolve(req.result || null);
    req.onerror = ()=>reject(req.error);
  });
}
async function deletePPTFile(id){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(DB_STORE,'readwrite');
    tx.objectStore(DB_STORE).delete(id);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}

function fmtSize(bytes){
  if (bytes > 1024*1024) return (bytes/1024/1024).toFixed(1)+'MB';
  return Math.round(bytes/1024)+'KB';
}

async function onPPTSelected(e){
  const file = e.target.files[0];
  e.target.value = '';
  if (!file || !currentMonthId) return;
  await savePPTFile(currentMonthId, file);
  toast('PPT가 첨부되었습니다 · 안건별 요점을 추출하는 중...');
  await loadPPTDisplay();
  await extractPPTPoints();
}

async function removePPT(){
  if (!currentMonthId) return;
  if (!confirm('첨부된 PPT를 삭제할까요?')) return;
  await deletePPTFile(currentMonthId);
  loadPPTDisplay();
}

async function loadPPTDisplay(){
  const empty = document.getElementById('ppt-empty');
  const info  = document.getElementById('ppt-info');
  const drop  = document.getElementById('ppt-drop');
  if (currentPPTUrl) { URL.revokeObjectURL(currentPPTUrl); currentPPTUrl = null; }

  if (!currentMonthId) { empty.style.display='block'; info.style.display='none'; drop.classList.remove('has-file'); return; }

  const rec = await loadPPTFile(currentMonthId);
  if (!rec) { empty.style.display='block'; info.style.display='none'; drop.classList.remove('has-file'); return; }

  currentPPTUrl = URL.createObjectURL(rec.file);
  document.getElementById('ppt-name').textContent = '📄 ' + rec.name;
  document.getElementById('ppt-meta').textContent = fmtSize(rec.size) + ' · 첨부 ' + new Date(rec.savedAt).toLocaleString('ko-KR');
  document.getElementById('ppt-open').href = currentPPTUrl;
  empty.style.display='none'; info.style.display='block'; drop.classList.add('has-file');
}

/* ── PPT 텍스트 추출 (SAFETY CONTACT 제외) + 안건별 요점 자동 정리 ── */
function decodeXmlEntities(s){
  return s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
}

function isSafetySlide(text){
  return /safety\s*contact|안전\s*컨택트?|안전\s*수칙\s*공유/i.test(text);
}

async function extractSlideTexts(file){
  const zip = await JSZip.loadAsync(file);
  const slideNames = Object.keys(zip.files)
    .filter(name => /^ppt\/slides\/slide\d+\.xml$/.test(name))
    .sort((a,b) => (+a.match(/slide(\d+)\.xml/)[1]) - (+b.match(/slide(\d+)\.xml/)[1]));

  const slides = [];
  for (const name of slideNames) {
    const xml = await zip.files[name].async('text');
    const texts = [...xml.matchAll(/<a:t>([^<]*)<\/a:t>/g)].map(m => decodeXmlEntities(m[1]));
    const text = texts.join(' ').replace(/\s+/g,' ').trim();
    if (text) slides.push(text);
  }
  return slides;
}

async function extractPPTPoints(){
  if (!currentMonthId) return;
  const statusEl = document.getElementById('ppt-extract-status');
  const rec = await loadPPTFile(currentMonthId);
  if (!rec) { toast('먼저 PPT를 첨부해주세요'); return; }

  const isOldPpt = /\.ppt$/i.test(rec.name) && !/\.pptx$/i.test(rec.name);
  if (isOldPpt) {
    statusEl.textContent = '⚠ 구형 .ppt 형식은 자동 추출을 지원하지 않아요. PowerPoint에서 "다른 이름으로 저장 → .pptx"로 변환 후 다시 업로드해주세요.';
    return;
  }
  if (typeof JSZip === 'undefined') {
    statusEl.textContent = '⚠ PPT 분석 라이브러리를 불러오지 못했습니다 (인터넷 연결을 확인해주세요).';
    return;
  }

  statusEl.textContent = '📄 슬라이드 텍스트를 읽는 중...';
  let slides;
  try {
    slides = await extractSlideTexts(rec.file);
  } catch (err) {
    console.error(err);
    statusEl.textContent = '⚠ PPT 파일을 읽지 못했습니다. .pptx 형식이 맞는지 확인해주세요.';

/* ── 음성 녹음 (회의 전체 1회 시작, 안건은 전환만) ── */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null, isRecording = false, isPaused = false, activeKey = null;
let restartFailCount = 0, restartTimer = null;
const MAX_RESTART_FAILS = 5;

if (SR) {
  recognition = new SR();
  recognition.lang = 'ko-KR';
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onstart = () => {
    restartFailCount = 0; // 정상적으로 다시 붙었으니 실패 카운트 초기화
  };

  recognition.onresult = (e) => {
    if (!activeKey) return;
    let finalText = '', interimText = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
      else interimText += e.results[i][0].transcript;
    }
    if (finalText.trim()) {
      const ta = document.getElementById('tx-' + activeKey);
      ta.value = (ta.value.trim() ? ta.value.trim() + ' ' : '') + finalText.trim();
    }
    showLiveCaption(finalText || interimText, !finalText);
  };

  recognition.onerror = (e) => {
    console.warn('STT:', e.error);
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      isRecording = false; isPaused = false; activeKey = null;
      if (restartTimer) { clearTimeout(restartTimer); restartTimer = null; }
      updateRecUI();
      hideLiveCaption();
      toast('🎤 마이크 권한이 막혀 있어요 — 주소창 왼쪽 자물쇠 아이콘에서 마이크를 "허용"으로 바꿔주세요');
    } else if (e.error === 'audio-capture') {
      isRecording = false; isPaused = false; activeKey = null;
      if (restartTimer) { clearTimeout(restartTimer); restartTimer = null; }
      updateRecUI();
      hideLiveCaption();
      toast('🎤 마이크 장치를 찾을 수 없어요');
    }
    // network / no-speech / aborted 등은 일시적인 경우가 많아 onend의 재시작 로직에 맡깁니다
  };

  // 침묵·네트워크 등으로 인식이 끊겨도, 녹음 중(일시정지 아님)이면 자동으로 이어서 재시작합니다.
  // 끊기자마자 바로 재시작하면 브라우저 내부 상태와 충돌해 실패할 수 있어 약간의 지연을 둡니다.
  recognition.onend = () => {
    if (!(isRecording && !isPaused)) { updateRecUI(); return; }
    if (restartTimer) clearTimeout(restartTimer);
    const delay = Math.min(300 * Math.pow(2, restartFailCount), 4000);
    restartTimer = setTimeout(() => {
      if (!(isRecording && !isPaused)) return;
      try {
        recognition.start();
      } catch (err) {
        restartFailCount++;
        console.warn('STT 재시작 실패', restartFailCount, err);
        if (restartFailCount >= MAX_RESTART_FAILS) {
          isRecording = false; isPaused = false; activeKey = null;
          updateRecUI();
          hideLiveCaption();
          toast('🔴 녹음이 중단됐어요 — "회의 녹음 시작"을 다시 눌러주세요');
        } else {
          // onend가 다시 호출되지 않는 경우를 대비해 스스로 재시도를 이어갑니다
          recognition.onend();
        }
      }
    }, delay);
  };
}

function startMeetingRecording(){
  if (!SR) { toast('이 브라우저는 음성인식을 지원하지 않습니다'); return; }
  if (!activeKey) activeKey = AGENDA[0].key;
  isRecording = true;
  isPaused = false;
  restartFailCount = 0;
  if (restartTimer) { clearTimeout(restartTimer); restartTimer = null; }
  try { recognition.start(); } catch (e) {}
  updateRecUI();
}

function pauseMeetingRecording(){
  if (!isRecording) return;
  isPaused = true;
  if (restartTimer) { clearTimeout(restartTimer); restartTimer = null; }
  recognition.stop();
  updateRecUI();
  hideLiveCaption();
}

function resumeMeetingRecording(){
  if (!isRecording) return;
  isPaused = false;
  restartFailCount = 0;
  try { recognition.start(); } catch (e) {}
  updateRecUI();
}

function stopMeetingRecording(){
  isRecording = false;
  isPaused = false;
  if (restartTimer) { clearTimeout(restartTimer); restartTimer = null; }
  if (recognition) recognition.stop();
  activeKey = null;
  updateRecUI();
  hideLiveCaption();
}

// "⏹ 녹음 종료" 버튼 전용: 녹음을 멈추고 자동으로 안건별 요점 정리까지 실행합니다
function endMeetingRecording(){
  stopMeetingRecording();
  summarizeAllSections();
}

function showLiveCaption(text, isInterim){
  const el = document.getElementById('rec-live-caption');
  if (!el || !text || !text.trim()) return;
  el.style.display = 'block';
  el.classList.toggle('interim', isInterim);
  el.innerHTML = '<b>듣고 있어요</b>' + text;
}
function hideLiveCaption(){
  const el = document.getElementById('rec-live-caption');
  if (el) { el.style.display = 'none'; el.innerHTML = ''; }
}

function setActiveSection(key){
  if (!isRecording || isPaused) return; // 녹음 중일 때만 안건 전환 가능
  activeKey = key;
  updateRecUI();
}

function updateRecUI(){
  const statusEl = document.getElementById('rec-status');
  const actionsEl = document.getElementById('rec-actions');
  if (!statusEl || !actionsEl) return;

  if (!isRecording) {
    statusEl.textContent = '녹음 대기 중';
    statusEl.className = 'global-rec-status';
    actionsEl.innerHTML = `<button class="btn btn-primary btn-sm" onclick="startMeetingRecording()">🎤 회의 녹음 시작</button>`;
  } else if (isPaused) {
    statusEl.textContent = '일시정지됨 (쉬는시간)';
    statusEl.className = 'global-rec-status paused';
    actionsEl.innerHTML = `
      <button class="btn btn-lime btn-sm" onclick="resumeMeetingRecording()">▶ 녹음 재개</button>
      <button class="btn btn-danger btn-sm" onclick="endMeetingRecording()">⏹ 녹음 종료</button>`;
  } else {
    const a = AGENDA.find(x=>x.key===activeKey);
    statusEl.textContent = `녹음 중 — 현재 안건: ${a ? agendaTitle(a) : '-'}`;
    statusEl.className = 'global-rec-status on';
    actionsEl.innerHTML = `
      <button class="btn btn-secondary btn-sm" onclick="pauseMeetingRecording()">⏸ 쉬는시간</button>
      <button class="btn btn-danger btn-sm" onclick="endMeetingRecording()">⏹ 녹음 종료</button>`;
  }
  updateSectionButtons();
}

function updateSectionButtons(){
  AGENDA.forEach(a=>{
    const btn = document.getElementById('pick-'+a.key);
    if (!btn) return;
    if (!isRecording) {
      btn.style.display = 'none';
    } else if (activeKey === a.key && !isPaused) {
      btn.style.display = 'inline-flex';
      btn.disabled = true;
      btn.classList.add('current');
      btn.textContent = '🔴 받아쓰는 중';
    } else {
      btn.style.display = 'inline-flex';
      btn.disabled = false;
      btn.classList.remove('current');
      btn.textContent = '📍 이 안건으로 전환';
    }
  });
}

    if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || res.status); }
    const data = await res.json();
    const text = data.content[0].text.trim();
    const jsonStr = text.replace(/^```json\s*|```$/g, '').trim();
    let parsed;
    try {
      parsed = JSON.parse(jsonStr);
    } catch (parseErr) {
      const reason = data.stop_reason === 'max_tokens'
        ? '응답이 너무 길어서 중간에 잘렸어요. 녹음 내용을 나눠서 다시 시도해주세요.'
        : 'AI 응답 형식이 예상과 달랐어요. 다시 시도해주세요.';
      throw new Error(reason);
    }
    if (parsed.corrected_transcript && parsed.corrected_transcript.trim()) {
      document.getElementById('tx-'+key).value = parsed.corrected_transcript.trim();
    }
    document.getElementById('sum-office-'+key).value = parsed.office_issues || '';
    document.getElementById('sum-mgmt-'+key).value = parsed.management_notes || '';
    if (!silent) toast('오타 교정과 요점 정리가 완료되었습니다');
    return true;
  } catch (err) {
    console.error(err);
    if (!silent) toast('요약 실패: ' + err.message);
    return false;
  } finally {
    btn.disabled = false; btn.textContent = '🪄 AI로 요점 정리';
  }
}

/* ── 전체 안건 자동 요점 정리 (녹음 종료 시 자동 호출) ── */
async function summarizeAllSections(){
  if (!CLAUDE_KEY) { toast('Claude API 키가 필요합니다 (영남지사 시작화면 ⚙ API 키에서 설정)'); return; }
  const targets = AGENDA.filter(a => document.getElementById('tx-'+a.key).value.trim());
  if (!targets.length) { toast('정리할 녹음 내용이 없어요'); return; }

  const btn = document.getElementById('summarize-all-btn');
  if (btn) { btn.disabled = true; btn.textContent = `정리 중... (0/${targets.length})`; }

  let done = 0, ok = 0;
  for (const a of targets) {
    const success = await summarizeSection(a.key, { silent:true });
    done++; if (success) ok++;
    if (btn) btn.textContent = `정리 중... (${done}/${targets.length})`;
  }

  if (btn) { btn.disabled = false; btn.textContent = '🪄 전체 안건 자동 요점 정리'; }
  toast(`${ok}/${targets.length}개 안건 요점 정리 완료`);
}

/* ── 저장/이력 ── */
function loadRecords(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch (e) { return {}; }
}
function saveRecords(obj){ localStorage.setItem(STORE_KEY, JSON.stringify(obj)); }

function collectSections(){
  const sections = {};
  AGENDA.forEach(a=>{
    sections[a.key] = {
      agenda: document.getElementById('sum-agenda-'+a.key).value,
      raw: document.getElementById('tx-'+a.key).value,
      officeIssues: document.getElementById('sum-office-'+a.key).value,
      mgmtNotes: document.getElementById('sum-mgmt-'+a.key).value,
    };
  });
  return sections;
}

async function saveRecord(){
  const month = document.getElementById('mo-month').value;
  if (!month) { toast('대상 월을 선택해주세요'); return; }
  const date = document.getElementById('mo-date').value;
  const time = document.getElementById('mo-time').value;
  const place = document.getElementById('mo-place').value.trim();
  const attendees = document.getElementById('mo-attendees').value.trim();
  const sections = collectSections();
  const pptRec = await loadPPTFile(month);

  const all = loadRecords();
  all[month] = { month, date, time, place, attendees, sections, pptName: pptRec ? pptRec.name : '', savedAt: new Date().toISOString() };
  saveRecords(all);
  renderHistory();
  toast('회의록이 저장되었습니다');
}

function renderHistory(){
  const all = loadRecords();
  const list = Object.values(all).sort((a,b)=> b.month.localeCompare(a.month));
  document.getElementById('hist-count').textContent = list.length + '건';
  const wrap = document.getElementById('hist-list');
  if (!list.length) {
    wrap.innerHTML = '<div class="empty"><div class="empty-icon">📭</div>저장된 지사회의 회의록이 없어요.</div>';
    return;
  }
  wrap.innerHTML = list.map(r => `
    <div class="hist-item ${r.month===currentMonthId?'active':''}" onclick="loadRecord('${r.month}')">
      <div>
        <div class="hist-main">${r.month} ${r.date ? '· 회의일 '+r.date : ''}</div>
        <div class="hist-sub">${r.pptName ? '📄 '+r.pptName+' · ' : ''}저장 ${new Date(r.savedAt).toLocaleString('ko-KR')}</div>
      </div>
      <button class="hist-del" onclick="event.stopPropagation();delRecord('${r.month}')">×</button>
    </div>
  `).join('');
}

async function loadRecord(month){
  const all = loadRecords();
  const r = all[month];
  if (!r) return;
  if (isRecording) stopMeetingRecording();
  document.getElementById('mo-month').value = r.month;
  document.getElementById('mo-date').value = r.date || '';
  document.getElementById('mo-time').value = r.time || '';
  document.getElementById('mo-place').value = r.place || '';
  document.getElementById('mo-attendees').value = r.attendees || '';
  currentMonthId = r.month;
  refreshLock();
  updatePeriodBadge();
  buildAgenda();
  AGENDA.forEach(a=>{
    const s = r.sections && r.sections[a.key];
    if (!s) return;
    document.getElementById('sum-agenda-'+a.key).value = s.agenda || '';
    document.getElementById('tx-'+a.key).value = s.raw || '';
    document.getElementById('sum-office-'+a.key).value = s.officeIssues || '';
    document.getElementById('sum-mgmt-'+a.key).value = s.mgmtNotes || '';
  });
  await loadPPTDisplay();
  document.getElementById('ppt-extract-status').textContent = '';
  renderHistory();
}

async function delRecord(month){
  if (!confirm('이 회의록을 삭제할까요? (첨부된 PPT도 함께 삭제됩니다)')) return;
  const all = loadRecords();
  delete all[month];
  saveRecords(all);
  await deletePPTFile(month);
  if (currentMonthId === month) clearForm();
  renderHistory();
}

function clearForm(){
  if (isRecording) stopMeetingRecording();
  currentMonthId = '';
  document.getElementById('mo-month').value = '';
  document.getElementById('mo-date').value = '';
  document.getElementById('mo-time').value = '';
  document.getElementById('mo-place').value = '';
  document.getElementById('mo-attendees').value = '';
  refreshLock();
  updatePeriodBadge();
  buildAgenda();
  loadPPTDisplay();
  document.getElementById('ppt-extract-status').textContent = '';
  document.getElementById('paste-transcript').value = '';
  renderHistory();
}

/* ── 회의록 텍스트 내보내기 ── */
function copyMinutes(){
  const month = document.getElementById('mo-month').value || '-';
  const date = document.getElementById('mo-date').value || '-';
  const time = document.getElementById('mo-time').value;
  const place = document.getElementById('mo-place').value.trim();
  const attendees = document.getElementById('mo-attendees').value.trim();
  let text = `[영남지사 지사회의 회의록] ${month} (회의일 ${date}${time !== '' ? ' '+time+'시' : ''})\n`;
  text += `장소: ${place || '-'}\n참석자: ${attendees || '-'}\n`;
  text += '(SAFETY CONTACT 제외)\n\n';

  AGENDA.forEach(a=>{
    const agenda = document.getElementById('sum-agenda-'+a.key).value.trim();
    const office = document.getElementById('sum-office-'+a.key).value.trim();
    const mgmt = document.getElementById('sum-mgmt-'+a.key).value.trim();
    const raw = document.getElementById('tx-'+a.key).value.trim();
    text += `■ ${agendaTitle(a)}\n`;
    text += `[주요 안건 및 현안]\n${agenda || '-'}\n`;
    if (office || mgmt) {
      text += `[영업소별 이슈]\n${office || '-'}\n[지사장·경영진 전달사항]\n${mgmt || '-'}\n\n`;
    } else {
      text += `[녹음 원문]\n${raw || '-'}\n\n`;
    }
  });

  navigator.clipboard.writeText(text).then(()=> toast('회의록이 복사되었습니다'))
    .catch(()=> toast('복사 실패 — 브라우저 권한을 확인하세요'));
}

/* ── 회의록 워드파일(.doc) 다운로드 ── */
function escapeHtmlText(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}
// "- " 불릿 줄이 있으면 목록으로, 없으면 줄바꿈 문단으로 변환
function textToHtmlBlock(text){
  const t = (text || '').trim();
  if (!t) return '<p style="color:#999">-</p>';
  const lines = t.split('\n').map(l=>l.trim()).filter(Boolean);
  const isBulletList = lines.length > 0 && lines.every(l => l.startsWith('-') || l.startsWith('•'));
  if (isBulletList) {
    return '<ul style="margin:4px 0 4px 18px;padding:0">' +
      lines.map(l => `<li style="margin-bottom:3px">${escapeHtmlText(l.replace(/^[-•]\s*/, ''))}</li>`).join('') +
      '</ul>';
  }
  return lines.map(l => `<p style="margin:0 0 6px 0">${escapeHtmlText(l)}</p>`).join('');
}

function downloadWordMinutes(){
  const month = document.getElementById('mo-month').value;
  if (!month) { toast('대상 월을 선택해주세요'); return; }
  const date = document.getElementById('mo-date').value || '';
  const time = document.getElementById('mo-time').value || '';
  const place = document.getElementById('mo-place').value.trim();
  const attendees = document.getElementById('mo-attendees').value.trim();

  const dateLabel = date ? new Date(date+'T00:00:00').toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'long' }) : '-';

  const sectionsHtml = AGENDA.map(a => {
    const agenda = document.getElementById('sum-agenda-'+a.key).value;
    const office = document.getElementById('sum-office-'+a.key).value;
    const mgmt = document.getElementById('sum-mgmt-'+a.key).value;
    const raw = document.getElementById('tx-'+a.key).value;
    const hasSummary = office.trim() || mgmt.trim();
    return `
      <h2 style="font-size:15pt;color:#00875A;border-bottom:1.5pt solid #00875A;padding-bottom:4pt;margin:22pt 0 10pt 0">${escapeHtmlText(agendaTitle(a))}</h2>
      <p style="font-weight:bold;margin:8pt 0 2pt 0">▪ 주요 안건 및 현안</p>
      ${textToHtmlBlock(agenda)}
      ${hasSummary ? `
        <p style="font-weight:bold;margin:10pt 0 2pt 0">▪ 영업소별 이슈</p>
        ${textToHtmlBlock(office)}
        <p style="font-weight:bold;margin:10pt 0 2pt 0">▪ 지사장·경영진 전달사항</p>
        ${textToHtmlBlock(mgmt)}
      ` : `
        <p style="font-weight:bold;margin:10pt 0 2pt 0">▪ 논의 내용</p>
        ${textToHtmlBlock(raw)}
      `}
    `;
  }).join('');

  const html = `<!DOCTYPE html>
<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head>
<meta charset="utf-8">
<title>영남지사 지사회의 회의록</title>
<!--[if gte mso 9]>
<xml><w:WordDocument><w:View>Print</w:View></w:WordDocument></xml>
<![endif]-->
<style>
  body{font-family:'맑은 고딕',sans-serif;font-size:10.5pt;color:#222;line-height:1.6}
  table{border-collapse:collapse;width:100%;margin-bottom:16pt}
  td,th{border:1pt solid #ccc;padding:6pt 10pt;font-size:10.5pt;text-align:left}
  th{background:#f0f0f0;width:20%;font-weight:bold}
</style>
</head>
<body>
  <h1 style="font-size:20pt;color:#00875A;margin-bottom:4pt">영남지사 지사회의 회의록</h1>

  <table>
    <tr><th>대상 월</th><td>${escapeHtmlText(month.slice(0,4))}년 ${escapeHtmlText(String(+month.slice(5,7)))}월</td></tr>
    <tr><th>회의일시</th><td>${escapeHtmlText(dateLabel)}${time !== '' ? ' ' + escapeHtmlText(time) + '시' : ''}</td></tr>
    <tr><th>장소</th><td>${escapeHtmlText(place) || '-'}</td></tr>
    <tr><th>참석자</th><td>${escapeHtmlText(attendees) || '-'}</td></tr>
  </table>
  ${sectionsHtml}
</body>
</html>`;

  const blob = new Blob(['﻿', html], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `영남지사_지사회의록_${month}.doc`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 5000);
  toast('회의록 워드파일을 다운로드했습니다');

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2400);
}
